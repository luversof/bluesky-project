server.port=30131
spring.application.name=bluesky-api-user
#spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v2.4.yml
spring.config.import=classpath:/bootstrap.yml

spring.cloud.config.name=bluesky-project

spring.session.store-type=redis
spring.session.redis.namespace=spring:session:bluesky

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://user.api.bluesky.local:30131
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://user.api.bluesky.local:30131/oauth2/jwks

# Authorization Server
spring.security.oauth2.authorizationserver.issuer=https://user.api.bluesky.local:30131

# Registered Client - bluesky-web-gate
bluesky.oauth2.registered-client.web-gate.redirect-uris=http://localhost:30122/login/oauth2/code/bluesky
bluesky.oauth2.registered-client.web-gate.post-logout-redirect-uris=http://localhost:30122/

# OAuth2 Client (for GitHub/Google login)
# GitHub와 Google OAuth 설정은 Config Server에서 로드됨
# spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
# spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# spring.security.oauth2.client.registration.github.scope=read:user,user:email
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=openid,profile,email

bluesky-boot.connection-info.readers.postgresql-datasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.connections.stock=user_postgresql

#---
spring.config.activate.on-profile=localdev | opdev
server.port=40131
spring.config.import=configserver:

spring.data.redis.host=redis.bluesky.local

# OAuth2 Resource Server (localdev/opdev)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev.bluesky.local:40131
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev.bluesky.local:40131/oauth2/jwks

# Authorization Server (localdev/opdev)
spring.security.oauth2.authorizationserver.issuer=https://dev.bluesky.local:40131

# Registered Client - bluesky-web-gate (localdev/opdev)
bluesky.oauth2.registered-client.web-gate.redirect-uris=https://dev.bluesky.local:30122/login/oauth2/code/bluesky,https://dev.bluesky.local:40122/login/oauth2/code/bluesky,http://localhost:30122/login/oauth2/code/bluesky
bluesky.oauth2.registered-client.web-gate.post-logout-redirect-uris=https://dev.bluesky.local:30122/,https://dev.bluesky.local:40122/,http://localhost:30122/

debug=true


#---
spring.config.activate.on-profile=k8sdev
spring.config.import=configserver:

# OAuth2 Resource Server (k8sdev)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://user.api.bluesky.local
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://user.api.bluesky.local/oauth2/jwks

# Authorization Server (k8sdev)
spring.security.oauth2.authorizationserver.issuer=https://user.api.bluesky.local

# Registered Client - bluesky-web-gate (k8sdev)
# Ingress 도메인으로 redirect
bluesky.oauth2.registered-client.web-gate.redirect-uris=https://gate.web.bluesky.local/login/oauth2/code/bluesky
bluesky.oauth2.registered-client.web-gate.post-logout-redirect-uris=https://gate.web.bluesky.local/


server.port=30131
spring.application.name=bluesky-api-user
spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v2.4.yml

spring.cloud.config.name=bluesky-project

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://user.api.bluesky.local:30131
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://user.api.bluesky.local:30131/oauth2/jwks

# Authorization Server
spring.security.oauth2.authorizationserver.issuer=https://user.api.bluesky.local:30131

# OAuth2 Client (for GitHub/Google login)
# GitHub와 Google OAuth 설정은 Config Server에서 로드됨
# spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
# spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# spring.security.oauth2.client.registration.github.scope=read:user,user:email
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=openid,profile,email

bluesky-boot.connection-info.readers.postgresql-datasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.connections.stock=user_postgresql

#---
spring.config.activate.on-profile=localdev | opdev
server.port=40131
spring.config.import=configserver:

# OAuth2 Resource Server (localdev/opdev)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev.bluesky.local:40131
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev.bluesky.local:40131/oauth2/jwks

# Authorization Server (localdev/opdev)
spring.security.oauth2.authorizationserver.issuer=https://dev.bluesky.local:40131

debug=true


#---
spring.config.activate.on-profile=k8sdev
spring.config.import=configserver:


server.port=30134
spring.application.name=bluesky-api-stock
#spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v2.4.yml
spring.config.import=classpath:/bootstrap.yml

spring.cloud.config.name=bluesky-project

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://user.api.bluesky.local:30131
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://user.api.bluesky.local:30131/oauth2/jwks

bluesky-boot.message-source.bookkeeping=classpath:stockMessage

bluesky-boot.connection-info.readers.postgresql-datasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.connections.stock=stock_postgresql

# Client-side request errors (missing/invalid request parameters) are answered with 400
# by StockRequestErrorHandler; keep them out of the ERROR log so 5xx alerts stay meaningful.
bluesky-boot.core.log-except-exception-list=MissingServletRequestParameterException,MethodArgumentTypeMismatchException,BindException,MethodArgumentNotValidException,ResponseStatusException,NoResourceFoundException,HttpRequestMethodNotSupportedException

# Compress JSON responses. Measured on real user data: one screen's calls total 186,943 bytes
# uncompressed (timeSeriesWithSummary 57,846 / dividend 53,565 / trade 45,127 / calculateProfit
# 19,533 / stockItem 10,872) and 20,383 bytes gzipped - 9.2x. The asset-growth full-range DAILY
# series alone is 1,592,175 bytes raw and 57,811 gzipped (27.5x). The gate and api-stock are
# separate pods, so this is real cluster network traffic on every screen load.
# min-response-size keeps small replies (dataStatus 175B, dividend/total 8B) uncompressed, where
# the gzip header would cost more than it saves.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,application/vnd.oai.openapi,text/html,text/plain
server.compression.min-response-size=1024

#---
spring.config.activate.on-profile=localdev | opdev
spring.config.import=configserver:
server.port=40134

# OAuth2 Resource Server (localdev/opdev)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev.bluesky.local:40131
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev.bluesky.local:40131/oauth2/jwks

debug=true

#---
spring.config.activate.on-profile=k8sdev
spring.config.import=configserver:



server.port=30135
spring.application.name=bluesky-api-poe
spring.config.import=classpath:/bootstrap.yml

spring.cloud.config.name=bluesky-project

# PoE game data / engine paths (migrated from gate) - outside git
poe.data-dir=${user.home}/.poe-gamedata
poe.pob.src-dir=${user.home}/.poe-gamedata/work/pob-src

#---
spring.config.activate.on-profile=localdev | opdev
spring.config.import=configserver:
server.port=40135

management.tracing.sampling.probability=1
debug=true

# localdev only: config repo has no bluesky-api-poe entry yet, so the config server
# does not supply an SSL keystore. Serve HTTPS directly with the local wildcard cert
# (gate calls https://dev.bluesky.local:40135). opdev/k8sdev get SSL from the config
# server, so they are excluded from this block.
#---
spring.config.activate.on-profile=localdev
server.ssl.key-store=${user.home}/_wildcard.bluesky.local+3.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit

#---
spring.config.activate.on-profile=k8sdev
spring.config.import=configserver:

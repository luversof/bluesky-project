spring.application.name=bluesky-app-google
spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v2.4.yml

spring.cloud.config.name=bluesky-project

#---
spring.config.activate.on-profile=localdev | opdev
spring.config.import=configserver:

debug=true

# connection-info
bluesky-boot.connection-info.readers.postgresql-datasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.connections.google_api=stock_postgresql
#bluesky-boot.connection-info.loaders.hikaridatasource.connections.google_api=google_api_postgresql

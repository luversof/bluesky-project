management:
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      show-values: always
    configprops.show-values: always
  endpoints.web.exposure.include: '*'
  tracing:
    # Spring Boot 4 에서 management.tracing.enabled -> management.tracing.export.enabled 로 변경됨
    export.enabled: true
    sampling.probability: 0.1
  # 메트릭은 prometheus 가 /actuator/prometheus 를 스크레이프하는 방식을 쓴다.
  # spring-boot-starter-opentelemetry 가 micrometer-registry-otlp 를 함께 가져오는데,
  # 그대로 두면 기본값 localhost:4318 로 메트릭 push 를 시도하다 매분 실패 로그를 남긴다.
  otlp.metrics.export.enabled: false
  # 로그는 앱에서 보내지 않고 opentelemetry-collector-logs DaemonSet 이
  # 컨테이너 stdout 을 읽어 loki 로 보낸다. (앱 수정 불필요 + 기동 실패 로그도 수집)
  opentelemetry.logging.export.enabled: false
  


logging:
  pattern.correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]" 
  include-application-name: false
#eureka:
#  instance:
#    instance-id: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}


---    
spring:
  config.activate.on-profile: localdev | opdev 
  cloud:
    config:
      uri: http://config.cloud.bluesky.local/
#    discovery:
#      enabled: false
  boot:
    admin:
      client:
        enabled: false
        url: http://admin.cloud.bluesky.local/
eureka:
  client:
    registerWithEureka: false
#    fetchRegistry: false
    serviceUrl:
      defaultZone: http://eureka1.cloud.bluesky.local/eureka/

# Spring Boot 4 에서 OTLP 프로퍼티가 management.opentelemetry.* 로 변경되었다.
# (tracing 쪽은 타입이 달라져 properties-migrator 가 자동 변환하지 못하므로 새 이름을 직접 써야 한다)
management.opentelemetry:
  tracing.export.otlp.endpoint: http://opentelemetry-collector.bluesky.local/v1/traces

---
spring:
  config.activate.on-profile: dockerdev
  cloud:
    inetutils:
      ignored-interfaces:
        - docker0
        - veth.*
      preferred-networks:
        - 192.168
        - 10.0
    config:
      uri: http://config-server:30101
  boot:
    admin:
      client:
        url: http://admin-server:30102
eureka:
  client:
    serviceUrl:
      defaultZone: http://netflix-eureka-server:30100/eureka
#  instance:
#    ip-address: 10.0.75.1


---
spring:
  config.activate.on-profile: k8sdev
  cloud:
    config:
      uri: http://bluesky-cloud-config-server-service.default.svc.cluster.local:30101
    kubernetes:
      loadbalancer:
        mode: SERVICE
      discovery:
        all-namespaces: true
        service-labels:
          spring-boot: true
  boot:
    admin:
      client:
        url: http://bluesky-cloud-admin-server-service.default.svc.cluster.local:30102
        instance:
          name: ${spring.application.name}-service
          service-host-type: ip
eureka:
  instance:
    prefer-ip-address: true
    appname: ${spring.application.name}-service
#    hostname: ${spring.application.name}-service.default.svc.cluster.local
  client:
    service-url:
      defaultZone: http://bluesky-cloud-netflix-eureka-server-1-service.default.svc.cluster.local:30100/eureka/,http://bluesky-cloud-netflix-eureka-server-2-service.default.svc.cluster.local:30100/eureka/

# Spring Boot 4 에서 OTLP 프로퍼티가 management.opentelemetry.* 로 변경되었다.
# (tracing 쪽은 타입이 달라져 properties-migrator 가 자동 변환하지 못하므로 새 이름을 직접 써야 한다)
management.opentelemetry:
  tracing.export.otlp.endpoint: http://opentelemetry-collector-service.opensource.svc.cluster.local:4318/v1/traces
admin.menu.guide.search=<b>\uAC80\uC0C9 \uC124\uC815</b> - \uBAA9\uB85D \uC704\uC5D0 \uB458 \uAC80\uC0C9\uCE78\uC744 \uACE0\uB985\uB2C8\uB2E4. \uB370\uC774\uD130\uAC00 \uB9CE\uB2E4\uBA74 \uAC80\uC0C9\uCE78\uB9C8\uB2E4 \uBCF4\uC774\uB294 \uC778\uB371\uC2A4 \uC0AC\uC6A9 \uC5EC\uBD80\uB97C \uBCF4\uACE0 \uC778\uB371\uC2A4\uB97C \uC4F0\uB294 \uC5F4\uC744 \uACE0\uB974\uC138\uC694. \uAC80\uC0C9\uC774 \uBE68\uB77C\uC9D1\uB2C8\uB2E4. \uCEEC\uB7FC\uACFC \uC778\uB371\uC2A4 \uC804\uCCB4\uB294 \uAC80\uC0C9 \uC124\uC815 \uC704 "{0} \uC815\uBCF4" \uB97C \uD3BC\uCE58\uBA74 \uBCF4\uC785\uB2C8\uB2E4.

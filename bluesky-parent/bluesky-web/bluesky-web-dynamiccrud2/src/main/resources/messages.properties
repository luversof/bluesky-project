admin.menu.guide.intro=이 화면에서 정한 대로 사용자가 쓰는 화면 하나가 만들어집니다. 그 화면에는 데이터 목록과, 목록 위 검색칸, 데이터를 추가 · 수정 · 삭제하는 단추가 있습니다. 아래 순서대로 설정하세요.
admin.menu.guide.basic=<b>기본 정보</b> - 화면 이름, 주소, 볼 수 있는 사람(권한), 한 쪽에 보일 줄 수를 정합니다. 목록의 열 이름과 입력칸 모양은 "{0} 필드 관리" 단추를 눌러 바꿉니다.
admin.menu.guide.query=<b>쿼리 설정</b> - 목록에 보일 데이터를 읽는 <b>조회 쿼리</b>는 메뉴를 만들 때 자동으로 하나 생깁니다. 데이터를 <b>추가 · 수정 · 삭제</b>하는 쿼리는 필요한 만큼 더할 수 있고, 하나를 더할 때마다 사용 화면에 그 단추가 생깁니다.
admin.menu.guide.search=<b>검색 설정</b> - 목록 위에 둘 검색칸을 고릅니다. 데이터가 많다면 검색칸마다 보이는 인덱스 사용 여부를 보고 인덱스를 쓰는 열을 고르세요. 검색이 빨라집니다. 컬럼과 인덱스 전체는 검색 설정 위 "{0} 정보" 를 펼치면 보입니다.
admin.menu.basic=기본 정보
admin.menu.queries=쿼리 설정
admin.menu.queries.help=목록을 읽는 조회 쿼리는 메뉴마다 하나이고 지울 수 없습니다. 추가 · 수정 · 삭제 쿼리는 필요한 만큼 더할 수 있으며, 하나마다 사용 화면에 단추가 하나 생깁니다. 이름은 단추에 적힐 글자이고, 권한을 비우면 메뉴 권한을 따릅니다.

gg.jte.usePrecompiledTemplates=true
server.port=30125
spring.application.name=bluesky-web-dynamiccrud2
spring.config.import=classpath:/bootstrap.yml

spring.cloud.config.name=bluesky-project

server.servlet.session.persistent=true
server.servlet.session.timeout=365d
server.servlet.session.cookie.name=BLUESKY_SESSION
server.servlet.session.cookie.domain=bluesky.local
spring.servlet.encoding.force=true

spring.mvc.problemdetails.enabled=true

# bluesky-boot.dev-check
bluesky-boot.dev-check.base-packages=net.luversof.web.dynamiccrud2
bluesky-boot.dev-check.enabled=true

# (s) bluesky-boot.locale
bluesky-boot.locale.enabled-locales=ko_KR
# (e) bluesky-boot.locale

# (s) bluesky-boot.connection-info
# dynamiccrud2 = setting catalog (PostgreSQL).
# other connections (connectioninfo store itself, target databases) are loaded on demand by name via ConnectionInfoUtil.
bluesky-boot.connection-info.readers.postgresql-datasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.enabled=true
bluesky-boot.connection-info.loaders.hikaridatasource.connections.dynamiccrud2setting=dynamiccrud2
# admin tool: low traffic but opens pools to many databases. Hikari default keeps 10 idle connections per pool,
# which hit "too many clients" on the shared PostgreSQL (2026-11-17). Keep pools small and release idle connections.
bluesky-boot.connection-info.loaders.hikaridatasource.properties.maximumPoolSize=5
bluesky-boot.connection-info.loaders.hikaridatasource.properties.minimumIdle=0
bluesky-boot.connection-info.loaders.hikaridatasource.properties.idleTimeout=60000
# (e) bluesky-boot.connection-info

# (s) bluesky-boot.htmx
bluesky-boot.htmx.enabled=true
# (e) bluesky-boot.htmx

spring.http.serviceclient.client-user.base-url=lb://bluesky-api-user

#---
spring.config.activate.on-profile=localdev | opdev
server.port=40125
spring.config.import=configserver:

spring.web.error.include-exception=true
spring.web.error.include-stacktrace=always
spring.web.error.include-binding-errors=always

spring.http.serviceclient.client-user.base-url=https://user.api.bluesky.local
# same as bluesky-web-gate (the default /login is 404)
bluesky.client.user.login-url=https://user.web.bluesky.local/login/redirect

spring.devtools.restart.enabled=false

#---
spring.config.activate.on-profile=localdev

gg.jte.developmentMode=true
gg.jte.usePrecompiledTemplates=false
gg.jte.templateLocation=src/main/jte

#---
spring.config.activate.on-profile=k8sdev
spring.config.import=configserver:
bluesky.client.user.login-url=https://user.web.bluesky.local/login/redirect

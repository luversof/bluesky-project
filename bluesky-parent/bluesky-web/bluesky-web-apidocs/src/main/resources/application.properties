server.port=30120
spring.application.name=bluesky-web-apidocs
#spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v4.2.yml
spring.config.import=classpath:/bootstrap.yml

spring.cloud.config.name=bluesky-project

# bluesky-boot dev-check pages (off unless enabled)
bluesky-boot.dev-check.enabled=true

# (s) api docs
# This app has no API of its own. Both UIs read the specs of the services below.
# Keep the two lists in sync when adding a service.

# Swagger UI : /swagger-ui.html
springdoc.swagger-ui.urls[0].name=bluesky-web-gate
springdoc.swagger-ui.urls[0].url=https://gate.web.bluesky.local/v3/api-docs
springdoc.swagger-ui.urls[1].name=bluesky-api-blog
springdoc.swagger-ui.urls[1].url=https://blog.api.bluesky.local/v3/api-docs
springdoc.swagger-ui.urls[2].name=bluesky-api-board
springdoc.swagger-ui.urls[2].url=https://board.api.bluesky.local/v3/api-docs
springdoc.swagger-ui.urls[3].name=bluesky-api-bookkeeping
springdoc.swagger-ui.urls[3].url=https://bookkeeping.api.bluesky.local/v3/api-docs
springdoc.swagger-ui.urls[4].name=bluesky-api-user
springdoc.swagger-ui.urls[4].url=https://user.api.bluesky.local/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.query-config-enabled=true

# Scalar : /scalar
scalar.enabled=true
# Do not send usage events to scalar.com from internal docs.
scalar.telemetry=false
scalar.sources[0].title=bluesky-web-gate
scalar.sources[0].url=https://gate.web.bluesky.local/v3/api-docs
scalar.sources[1].title=bluesky-api-blog
scalar.sources[1].url=https://blog.api.bluesky.local/v3/api-docs
scalar.sources[2].title=bluesky-api-board
scalar.sources[2].url=https://board.api.bluesky.local/v3/api-docs
scalar.sources[3].title=bluesky-api-bookkeeping
scalar.sources[3].url=https://bookkeeping.api.bluesky.local/v3/api-docs
scalar.sources[4].title=bluesky-api-user
scalar.sources[4].url=https://user.api.bluesky.local/v3/api-docs
# (e) api docs

#---
spring.config.activate.on-profile=localdev | opdev
spring.config.import=configserver:
server.port=40120

debug=true


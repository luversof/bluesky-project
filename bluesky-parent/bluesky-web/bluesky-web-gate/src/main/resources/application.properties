# OAuth2 Client 설정

## Bluesky Authorization Server (Token Exchange용)
spring.security.oauth2.client.registration.bluesky.client-id=bluesky-web-gate
spring.security.oauth2.client.registration.bluesky.client-secret=secret
spring.security.oauth2.client.registration.bluesky.authorization-grant-type=urn:ietf:params:oauth:grant-type:token-exchange
spring.security.oauth2.client.registration.bluesky.scope=openid,profile,email,board.read,board.write,stock.read,stock.write

spring.security.oauth2.client.provider.bluesky.token-uri=https://user.api.bluesky.local:30131/oauth2/token


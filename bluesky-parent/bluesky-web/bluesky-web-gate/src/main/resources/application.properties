server.port=30122
spring.application.name=bluesky-web-gate
#spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v2.4.yml
spring.config.import=classpath:/bootstrap.yml

spring.cloud.config.name=bluesky-project

server.servlet.session.persistent=true
server.servlet.session.timeout=12h

# Compress text responses (html/css/js/json). Static assets are served uncompressed
# otherwise: main.css alone is ~130KB raw vs ~19KB gzipped.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
spring.servlet.encoding.force=true

#spring.session.data.redis.namespace=spring:session:bluesky

spring.mvc.problemdetails.enabled=true
spring.messages.basename=classpath:gateMessage,classpath:uiMessage
spring.messages.fallback-to-system-locale=false
#spring.messages.basename=gateMessage,uiMessage

bluesky-boot.dev-check.base-package-list=io.github.luversof,net.luversof

#spring.mustache.servlet.content-type=text/mustache

bluesky-boot.htmx.enabled=true

bluesky-boot.web.locale-resolve-handler.cookie.locale-resolve-info-condition=cookie
bluesky-boot.web.locale-resolve-handler.cookie.set-representative-condition=overwrite-if-not-exists
bluesky-boot.web.locale-resolve-handler.cookie.pre-locale-resolve-info-condition=use-first

bluesky-boot.web.locale-context-resolver.preset=BASIC



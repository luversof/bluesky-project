server.port=30122
spring.application.name=bluesky-web-gate
spring.config.import=https://raw.githubusercontent.com/luversof/bluesky-config-repo/develop/bootstrap_v2.4.yml

spring.cloud.config.name=bluesky-project

server.servlet.session.persistent=true
server.servlet.session.timeout=365d
server.servlet.session.cookie.name=BLUESKY_SESSION
server.servlet.session.cookie.domain=bluesky.local
spring.servlet.encoding.force=true

spring.mvc.problemdetails.enabled=true
spring.messages.basename=classpath:gateMessage,classpath:uiMessage
#spring.messages.basename=gateMessage,uiMessage

spring.data.web.pageable.default-page-size=10

#spring.mustache.servlet.content-type=text/mustache

bluesky-boot.htmx.enabled=true

#bluesky.web.common.menu.main[0].message-code=layout.menu.main.home
#bluesky.web.common.menu.main[0].url=/
#bluesky.web.common.menu.main[0].active-url-pattern=^\/$
bluesky.web.common.menu.main[0].message-code=layout.menu.main.board
bluesky.web.common.menu.main[0].url=/board
bluesky.web.common.menu.main[1].message-code=layout.menu.main.blog
bluesky.web.common.menu.main[1].url=/blog
bluesky.web.common.menu.main[2].message-code=layout.menu.main.bookkeeping
bluesky.web.common.menu.main[2].url=/bookkeeping
bluesky.web.common.menu.main[3].message-code=layout.menu.main.stock
bluesky.web.common.menu.main[3].url=/stock
bluesky.web.common.menu.main[4].message-code=layout.menu.main.dev
bluesky.web.common.menu.main[4].url=/dev
bluesky.web.common.menu.main[4].display=false

bluesky.web.common.menu.board[0].message-code=layout.menu.board.free
bluesky.web.common.menu.board[0].url=/board/free/list
bluesky.web.common.menu.board[0].active-url-pattern=/board/free/.*
bluesky.web.common.menu.board[1].message-code=layout.menu.board.test
bluesky.web.common.menu.board[1].url=/board/empty/list
bluesky.web.common.menu.board[1].active-url-pattern=/board/empty/.*

bluesky.web.common.menu.stock[0].message-code=layout.menu.stock.tradeProfit
bluesky.web.common.menu.stock[0].url=/stock
bluesky.web.common.menu.stock[0].active-url-pattern=/stock$

bluesky.web.common.menu.stock[2].message-code=layout.menu.stock.dividend
bluesky.web.common.menu.stock[2].url=/stock/dividend
bluesky.web.common.menu.stock[2].active-url-pattern=/stock/dividend.*

bluesky.web.common.menu.stock[1].message-code=layout.menu.stock.dashboard
bluesky.web.common.menu.stock[1].url=/stock/dashboard
bluesky.web.common.menu.stock[1].active-url-pattern=/stock/dashboard.*

# OAuth2 Client 설정

## Bluesky Authorization Server (Token Exchange용)
spring.security.oauth2.client.registration.bluesky.client-id=bluesky-web-gate
spring.security.oauth2.client.registration.bluesky.client-secret=secret
spring.security.oauth2.client.registration.bluesky.authorization-grant-type=urn:ietf:params:oauth:grant-type:token-exchange
spring.security.oauth2.client.registration.bluesky.scope=openid,profile,email,board.read,board.write,stock.read,stock.write

spring.security.oauth2.client.provider.bluesky.token-uri=https://user.api.bluesky.local:30131/oauth2/token


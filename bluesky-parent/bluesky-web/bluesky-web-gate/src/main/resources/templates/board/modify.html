<!DOCTYPE html>
<html lang="ko" data-layout-decorate="~{_layout/boardLayout}">

<head>
	<title>게시판 글 수정</title>
	<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
	<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
</head>

<body data-board-mode="modify" data-th-attr="data-board-id=${board.id},data-board-alias=${board.alias}">
	<div data-layout-fragment="content-board" class="container mx-auto px-4 py-8">
		<div class="max-w-4xl mx-auto">
			<!-- 헤더 -->
			<div class="mb-6">
				<h1 class="text-3xl font-bold">글 수정</h1>
				<p class="text-gray-600 mt-2">게시글을 수정해주세요</p>
			</div>
			
			<!-- 수정 폼 -->
			<div class="bg-base-100 rounded-lg shadow-xl p-6">
				<input type="hidden" id="boardArticleId" data-th-value="${boardArticle.id}" />
				
				<div class="form-control mb-6">
					<label class="label" for="title">
						<span class="label-text font-semibold">제목</span>
						<span class="label-text-alt text-error">*</span>
					</label>
					<input type="text" id="title" placeholder="제목을 입력하세요" 
						class="input input-bordered w-full" maxlength="200" 
						data-th-value="${boardArticle.title}" />
				</div>
				
				<div class="form-control mb-6">
					<label class="label" for="content">
						<span class="label-text font-semibold">내용</span>
						<span class="label-text-alt text-error">*</span>
					</label>
					<textarea id="content" class="textarea textarea-bordered" rows="15" 
						placeholder="내용을 입력하세요" data-th-text="${boardArticle.content}"></textarea>
				</div>
				
				<div class="flex justify-between items-center pt-4 border-t">
					<div class="text-sm text-gray-500">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
						</svg>
						마크다운 문법을 사용할 수 있습니다
					</div>
					<div class="flex gap-2">
						<button class="btn btn-ghost cancelButton">
							<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
							</svg>
							<span data-th-text="#{board.button.cancel}">취소</span>
						</button>
						<button class="btn btn-primary modifyButton">
							<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
							</svg>
							<span data-th-text="#{board.button.modify}">수정하기</span>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>

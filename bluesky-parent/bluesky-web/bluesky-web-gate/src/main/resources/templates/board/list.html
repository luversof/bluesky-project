<!DOCTYPE html>
<html data-layout-decorate="~{_components/layout/boardLayout}">

<head>
</head>

<body>
	<div data-layout-fragment="content-board">
		[[${boardAlias}]]
		<div id="indicator" class="text-center my-10 hidden">
			<span class="loading loading-ring loading-lg"></span>
		</div>
		<div id="boardList"
			class="text-center"
			data-th-attr="hx-get=@{/board/htmx/{boardAlias}/list(boardAlias=${boardAlias})}"
			hx-trigger="load delay:0s, listHtmxTrigger"
			hx-swap="transition:true"
			hx-indicator="#indicator"
			hx-vals="js:{
				'page' : param.getRequestPage()
			}">
		</div>
	</div>
</body>

</html>

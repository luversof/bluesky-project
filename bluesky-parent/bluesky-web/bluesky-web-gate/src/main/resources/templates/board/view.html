<!DOCTYPE html>
<html lang="ko" data-layout-decorate="~{_layout/boardLayout}">

<head>
	<title>게시글 보기</title>
</head>

<body data-board-mode="view"
	data-th-attr="data-board-id=${board.id},data-board-alias=${board.alias},data-board-article-id=${boardArticleId},data-is-authenticated=${isAuthenticated},data-current-user-id=${currentUserId != null ? currentUserId : ''},data-comment-delete-label=#{board.comment.delete},data-comment-delete-confirm=#{board.comment.deleteConfirm},data-comment-required=#{board.comment.required},data-comment-create-success=#{board.comment.createSuccess},data-comment-delete-success=#{board.comment.deleteSuccess}">
	<div data-layout-fragment="content-board" class="container mx-auto px-4 py-8">
		<div class="max-w-4xl mx-auto">
			<!-- 게시글 헤더 -->
			<div class="bg-base-100 rounded-lg shadow-xl p-6 mb-4">
				<h1 class="text-3xl font-bold mb-4" data-th-text="${boardArticle.title}">제목</h1>
				
				<div class="flex items-center justify-between text-sm text-gray-600 pb-4 border-b">
					<div class="flex items-center gap-4">
						<div class="flex items-center gap-1">
							<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
							</svg>
							<span data-th-text="${boardArticle.username}">작성자</span>
						</div>
						<div class="flex items-center gap-1">
							<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
							</svg>
							<span data-th-text="${#temporals.format(boardArticle.createdDate)}">2025-01-01</span>
						</div>
					</div>
				</div>
			</div>
			
			<!-- 게시글 내용 -->
			<div class="bg-base-100 rounded-lg shadow-xl p-6 mb-4">
				<article class="prose max-w-none">
					<div data-th-utext="${boardArticle.content}">내용</div>
				</article>
			</div>
			<!-- 댓글 영역 -->
			<div class="bg-base-100 rounded-lg shadow-xl p-6 mb-6" id="commentSection">
				<div class="flex items-center justify-between mb-4">
					<h2 class="text-2xl font-bold" data-th-text="#{board.comment.title}">댓글</h2>
					<div class="text-sm text-gray-500">
						<span data-th-text="#{board.comment.countPrefix}">
							댓글
						</span>
						<span id="commentCount" class="font-semibold">0</span>
					</div>
				</div>
				<div id="commentList" class="space-y-4" data-th-attr="data-empty-text=#{board.comment.empty}">
					<p class="text-sm text-gray-500" data-th-text="#{board.comment.empty}">아직 댓글이 없습니다.</p>
				</div>
				<button id="commentLoadMore" type="button" class="btn btn-ghost w-full mt-4 hidden" data-th-text="#{board.comment.loadMore}">더 보기</button>
				<div class="mt-6" data-th-if="${isAuthenticated}">
					<form id="commentForm" class="space-y-3">
						<label class="block text-sm font-medium" for="commentContent" data-th-text="#{board.comment.placeholder}">댓글을 입력하세요.</label>
						<textarea id="commentContent" class="textarea textarea-bordered w-full" rows="4"
							data-th-attr="placeholder=#{board.comment.placeholder}"></textarea>
						<div class="flex justify-end gap-2">
							<button type="button" class="btn btn-primary commentSubmitButton"
								data-th-text="#{board.comment.submit}">등록</button>
						</div>
					</form>
				</div>
				<div class="mt-6 text-sm text-gray-500" data-th-unless="${isAuthenticated}" data-th-text="#{board.comment.loginRequired}">댓글을 작성하려면 로그인이 필요합니다.</div>
			</div>
			
			<!-- 액션 버튼 -->
			<div class="flex justify-between items-center">
				<div>
					<button class="btn btn-ghost listButton">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
						</svg>
						<span data-th-text="#{board.button.list}">목록</span>
					</button>
				</div>
				<div class="flex gap-2">
					<button class="btn btn-primary writeButton">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
						</svg>
						<span data-th-text="#{board.button.write}">글쓰기</span>
					</button>
					<button data-th-if="${isOwner}" class="btn btn-secondary modifyButton" data-th-data-boardArticleId="${boardArticle.id}">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
						</svg>
						<span data-th-text="#{board.button.modify}">수정</span>
					</button>
					<button data-th-if="${isOwner}" class="btn btn-error deleteButton" data-th-data-boardArticleId="${boardArticle.id}">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
						</svg>
						<span data-th-text="#{board.button.delete}">삭제</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</body>

</html>

<!DOCTYPE html>
<html
	lang="ko"
	data-th-data-theme="${thymeleafUtil.getRandomTheme()}" 
	data-th-with="
		thymeleafUtil = ${T(net.luversof.web.gate.util.ThymeleafUtil)},
		path_icons = '_components/icons',
	"
>
<head>
	<title>Bluesky</title>
	<link data-th-href="@{/main.css}" rel="stylesheet" />
	<script src="https://unpkg.com/theme-change"></script>
	<script src="https://unpkg.com/htmx.org"></script>
	<script src="https://unpkg.com/htmx-ext-json-enc/json-enc.js"></script>
	<script data-th-src="@{/js/common.js}"></script>
</head>

<body>
	<div id="app-config" data-th-attr="data-login-url=@{/login}"></div>

	<div data-th-replace="~{_components/body/navbar/navbar}" />

	<div data-layout-fragment="content" />
	
	<footer data-th-replace="~{_components/body/footer}" />

</body>
</html>

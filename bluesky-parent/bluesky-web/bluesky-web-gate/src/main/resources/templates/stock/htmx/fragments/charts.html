<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="allocation" class="card bg-base-100 shadow-xl h-full">
    <div class="card-body">
        <h2 class="card-title text-base-content/70">자산 비중</h2>
        <div class="h-64 flex justify-center items-center">
            <canvas id="allocationChart"></canvas>
        </div>
    </div>
    <script th:inline="javascript">
        (function() {
            // Check if Chart is loaded
            if (typeof Chart === 'undefined') {
                console.error('Chart.js not loaded. Waiting...');
                return;
            }
            const ctx = document.getElementById('allocationChart').getContext('2d');
            const data = /*[[${allocation}]]*/ {};

            const labels = Object.keys(data);
            const values = Object.values(data);

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        })();
    </script>
</div>

<div th:fragment="dividend" class="card bg-base-100 shadow-xl h-full">
    <div class="card-body">
        <h2 class="card-title text-base-content/70">월별 배당금</h2>
        <div class="h-64 flex justify-center items-center">
            <canvas id="dividendChart"></canvas>
        </div>
    </div>
    <script th:inline="javascript">
        (function() {
            if (typeof Chart === 'undefined') return;
            const ctx = document.getElementById('dividendChart').getContext('2d');
            const data = /*[[${monthlyDividends}]]*/ {};

            const labels = Object.keys(data);
            const values = Object.values(data);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '배당금 (원)',
                        data: values,
                        backgroundColor: '#36A2EB',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        })();
    </script>
</div>

</body>
</html>

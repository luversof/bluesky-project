<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="summary">
    <div class="stats stats-vertical lg:stats-horizontal shadow w-full">
        <!-- 총 자산 -->
        <div class="stat">
            <div class="stat-figure text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div class="stat-title">총 자산</div>
            <div class="stat-value text-primary" th:text="${#numbers.formatDecimal(totalAsset, 0, 'COMMA', 0, 'POINT')} + ' 원'"></div>
            <div class="stat-desc">평가 금액 합계</div>
        </div>

        <!-- 실현 손익 -->
        <div class="stat">
            <div class="stat-figure text-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
            </div>
            <div class="stat-title">실현 손익</div>
            <div class="stat-value" th:classappend="${totalRealizedProfit >= 0} ? 'text-success' : 'text-error'"
                 th:text="${#numbers.formatDecimal(totalRealizedProfit, 0, 'COMMA', 0, 'POINT')}"></div>
            <div class="stat-desc">매도 완료분</div>
        </div>

        <!-- 평가 손익 -->
        <div class="stat">
            <div class="stat-title">평가 손익</div>
             <div class="stat-value" th:classappend="${totalUnrealizedProfit >= 0} ? 'text-success' : 'text-error'"
                 th:text="${#numbers.formatDecimal(totalUnrealizedProfit, 0, 'COMMA', 0, 'POINT')}"></div>
            <div class="stat-desc">현재 보유분</div>
        </div>

        <!-- 누적 배당 -->
        <div class="stat">
            <div class="stat-title">누적 배당금</div>
             <div class="stat-value text-info"
                 th:text="${#numbers.formatDecimal(totalDividend, 0, 'COMMA', 0, 'POINT')}"></div>
            <div class="stat-desc">전체 기간</div>
        </div>

        <!-- 승률 -->
        <div class="stat">
            <div class="stat-title">종목 승률</div>
            <div class="stat-value" th:text="${#numbers.formatDecimal(winRate, 1, 1)} + '%'"></div>
            <div class="stat-desc">수익권 종목 비율</div>
        </div>
    </div>
    
    <!-- Top Lists (3 Columns) -->
    <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Top Buying -->
        <div class="card bg-base-100 shadow-sm compact border border-base-200" th:if="${not #lists.isEmpty(topBuying)}">
            <div class="card-body p-3">
                <h3 class="card-title text-sm opacity-70 mb-2">💰 매수 상위</h3>
                <div class="space-y-2">
                    <div th:each="item, iter : ${topBuying}" class="flex justify-between items-center text-sm">
                        <div class="flex items-center gap-2">
                            <span class="badge badge-sm badge-ghost" th:text="${iter.count}">1</span>
                            <span class="truncate max-w-[100px]" th:text="${item.stockItemName}">종목</span>
                        </div>
                        <span class="font-mono font-bold" 
                              th:text="${#numbers.formatDecimal(item.totalBuyCost, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top Realized Profit -->
        <div class="card bg-base-100 shadow-sm compact border border-base-200" th:if="${not #lists.isEmpty(topRealized)}">
            <div class="card-body p-3">
                <h3 class="card-title text-sm opacity-70 mb-2">📈 실현 수익 상위</h3>
                <div class="space-y-2">
                    <div th:each="item, iter : ${topRealized}" class="flex justify-between items-center text-sm">
                        <div class="flex items-center gap-2">
                            <span class="badge badge-sm badge-ghost" th:text="${iter.count}">1</span>
                            <span class="truncate max-w-[100px]" th:text="${item.stockItemName}">종목</span>
                        </div>
                        <span class="font-mono font-bold" 
                              th:classappend="${item.realizedProfitNet >= 0} ? 'text-success' : 'text-error'"
                              th:text="${#numbers.formatDecimal(item.realizedProfitNet, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top Dividend -->
        <div class="card bg-base-100 shadow-sm compact border border-base-200" th:if="${not #lists.isEmpty(topDividend)}">
            <div class="card-body p-3">
                <h3 class="card-title text-sm opacity-70 mb-2">🎁 배당 상위</h3>
                <div class="space-y-2">
                    <div th:each="entry, iter : ${topDividend}" class="flex justify-between items-center text-sm">
                        <div class="flex items-center gap-2">
                            <span class="badge badge-sm badge-ghost" th:text="${iter.count}">1</span>
                            <span class="truncate max-w-[100px]" th:text="${entry.key}">종목</span>
                        </div>
                        <span class="font-mono font-bold text-info" 
                              th:text="${#numbers.formatDecimal(entry.value, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-layout-decorate="~{_layout/stockLayout}">
<head>
    <title>분석</title>
</head>
<body>
    <div data-layout-fragment="content-stock" class="container mx-auto p-4 space-y-6">
        <!-- Chart.js Library -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <!-- Reuse the daily summary component designed for analytics -->
        <h1 class="text-2xl font-bold mb-4 ml-1">자산 통계</h1>
        <div class="mb-8">
             <div hx-get="/stock/htmx/analytics/view" hx-trigger="load" hx-swap="outerHTML">
                 <div class="flex justify-center p-10">
                    <span class="loading loading-spinner text-primary loading-lg"></span>
                 </div>
            </div>
        </div>
    </div>
</body>
</html>

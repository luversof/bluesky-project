<div th:fragment="adminActions" class="card bg-base-100 shadow-xl mb-6" sec:authorize="isAuthenticated()">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            데이터 관리
        </h2>
        <div class="flex flex-wrap gap-4">
            <button hx-post="/api/stock/admin/stock-items"
                    hx-swap="none"
                    hx-indicator="#update-loading"
                    hx-confirm="주식 종목 정보를 갱신하시겠습니까?"
                    hx-on:htmx:after-request="if(event.detail.successful) window.location.reload();"
                    class="btn btn-outline gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                종목 갱신 (Stock Items)
            </button>
            <button hx-post="/api/stock/admin/trades"
                    hx-swap="none"
                    hx-indicator="#update-loading"
                    hx-confirm="매매 내역을 갱신하시겠습니까?"
                    hx-on:htmx:after-request="if(event.detail.successful) window.location.reload();"
                    class="btn btn-outline gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
                매매 내역 갱신 (Trades)
            </button>
            <button hx-post="/api/stock/admin/dividends"
                    hx-swap="none"
                    hx-indicator="#update-loading"
                    hx-confirm="배당 내역을 갱신하시겠습니까?"
                    hx-on:htmx:after-request="if(event.detail.successful) window.location.reload();"
                    class="btn btn-outline gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                배당 내역 갱신 (Dividends)
            </button>
        </div>
    </div>
    
    <div id="update-loading" class="htmx-indicator fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-base-100 p-8 rounded-lg shadow-xl flex flex-col items-center gap-4">
            <span class="loading loading-spinner loading-lg text-primary"></span>
            <div class="text-lg font-bold">데이터 갱신 중입니다...</div>
            <div class="text-sm opacity-70">잠시만 기다려주세요.</div>
        </div>
    </div>
</div>

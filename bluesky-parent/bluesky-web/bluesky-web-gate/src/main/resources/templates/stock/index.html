<!DOCTYPE html>
<html lang="ko" data-layout-decorate="~{_layout/stockLayout}">

<head>
	<title>주식 손익 통계</title>
	<script data-th-src="@{/js/stock/tradeProfit.js}" defer></script>
	<!-- Chart.js CDN -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
	<script type="module" data-th-src="@{/js/stock/timeSeriesChart.js}" defer></script>
</head>

<body>
	<div data-layout-fragment="content-stock">
		<div class="container mx-auto px-4 py-8 max-w-7xl">
			<!-- 로그인 필요 메시지 -->
			<div sec:authorize="isAnonymous()" class="alert alert-warning mb-6">
				<svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none"
					viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
						d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
				</svg>
				<div>
					<h3 class="font-bold">로그인이 필요합니다</h3>
					<div class="text-xs">주식 손익 통계를 조회하려면 <a data-th-href="@{/login}" class="link link-primary">로그인</a>해주세요.</div>
				</div>
			</div>

			<!-- 페이지 헤더 -->
			<div class="mb-8">
				<h1 class="text-4xl font-bold mb-2">주식 손익 통계</h1>
				<p class="text-base-content/70">수수료와 세금을 반영한 실제 손익을 확인하세요</p>
			</div>

			<!-- 필터 폼 -->
			<div class="card bg-base-100 shadow-xl mb-6">
				<div class="card-body">
					<h2 class="card-title text-2xl mb-4">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
						</svg>
						조회 조건
					</h2>
					
					<form
						id="tradeProfitForm"
						hx-get="/stock/htmx/calculateProfit"
						hx-target="#tradeProfitResult"
						hx-swap="innerHTML"
						hx-indicator="#loading"
						class="space-y-4">

						<!-- 그룹화 기준 -->
						<div class="form-control">
							<label class="label" for="groupBy">
								<span class="label-text font-semibold">그룹화 기준</span>
							</label>
							<select id="groupBy" name="groupBy" class="select select-bordered w-full">
								<option value="ACCOUNT_AND_STOCKITEM">계좌 + 종목별</option>
								<option value="STOCKITEM">종목별만</option>
							</select>
							<label class="label">
								<span class="label-text-alt">손익을 어떻게 그룹화할지 선택하세요</span>
							</label>
						</div>

						<!-- 계좌 및 종목 ID -->
						<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
							<div class="form-control">
								<label class="label" for="accountIdList">
									<span class="label-text font-semibold">계좌 선택 (다중 선택 가능)</span>
								</label>
								<select id="accountIdList" name="accountIdList" multiple class="select select-bordered w-full">
									<option value="">선택 안함</option>
									<option th:each="acc : ${accounts}" th:value="${acc.id}" th:text="${acc.name}"></option>
								</select>
								<label class="label" for="accountIdList-help">
									<span id="accountIdList-help" class="label-text-alt">Ctrl(또는 Shift) 클릭으로 여러 계좌 선택 가능</span>
								</label>
							</div>

							<div class="form-control">
								<label class="label">
									<span class="label-text font-semibold">종목 선택</span>
								</label>
								<div class="border border-base-300 rounded-lg h-60 overflow-y-auto p-2 bg-base-100 shadow-inner">
									<div class="grid grid-cols-1 gap-1">
										<label class="label cursor-pointer justify-start gap-3 py-1.5 hover:bg-base-200 rounded transition-colors px-2" th:each="s : ${stockItems}">
											<input type="checkbox" name="stockItemIdList" th:value="${s.id}" 
												   class="checkbox checkbox-sm checkbox-primary rounded-sm" />
											<span class="label-text truncate text-sm" th:text="${s.name + ' (' + s.symbol + ')'}">Stock</span>
										</label>
									</div>
								</div>
								<label class="label">
									<span class="label-text-alt">체크박스로 원하는 종목들을 선택하세요</span>
								</label>
							</div>
						</div>

						<!-- 날짜 범위 -->
						<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
							<div class="form-control">
								<label class="label" for="startDate">
									<span class="label-text font-semibold">시작일 (선택)</span>
								</label>
								<input 
									type="datetime-local" 
									id="startDate" 
									name="startDate" 
									class="input input-bordered w-full" />
								<label class="label">
									<span class="label-text-alt">거래 조회 시작 날짜</span>
								</label>
							</div>

							<div class="form-control">
								<label class="label" for="endDate">
									<span class="label-text font-semibold">종료일 (선택)</span>
								</label>
								<input 
									type="datetime-local" 
									id="endDate" 
									name="endDate" 
									class="input input-bordered w-full" />
								<label class="label">
									<span class="label-text-alt">거래 조회 종료 날짜</span>
								</label>
							</div>
						</div>

						<!-- 제출 버튼 -->
						<div class="card-actions justify-end pt-4">
							<button type="submit" class="btn btn-primary btn-lg gap-2">
								<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
								</svg>
								손익 조회
							</button>
						</div>
					</form>
				</div>
			</div>

			<!-- 로딩 인디케이터 -->
			<div id="loading" class="htmx-indicator flex justify-center items-center py-12">
				<div class="text-center">
					<span class="loading loading-spinner loading-lg text-primary"></span>
					<p class="mt-4 text-base-content/70">데이터를 불러오는 중...</p>
				</div>
			</div>

			<!-- 결과 영역 -->
			<div id="tradeProfitResult" class="space-y-4">
				<!-- Time-series chart -->
				<div class="card bg-base-100 shadow mb-4 p-4">
					<h3 class="font-semibold mb-2">포트폴리오 시계열</h3>
					<canvas id="timeSeriesChart" width="800" height="320"></canvas>
				</div>
				<!-- HTMX로 로드될 결과 -->
			</div>
		</div>
	</div>
		<script>
			// wire form submit to update chart as well as HTMX result
			(function(){
				function collectParams() {
					const params = {};
					const groupBy = document.getElementById('groupBy').value;
					params.groupBy = groupBy;

					const accountSel = document.getElementById('accountIdList');
					const accounts = Array.from(accountSel.selectedOptions).map(o => o.value).filter(v => v);
					if (accounts.length) params.accountIdList = accounts;

					const stockChecks = document.querySelectorAll('input[name="stockItemIdList"]:checked');
					const stocks = Array.from(stockChecks).map(c => c.value);
					if (stocks.length) params.stockItemIdList = stocks;

					const start = document.getElementById('startDate').value;
					const end = document.getElementById('endDate').value;
					if (start) params.startDate = new Date(start).toISOString();
					if (end) params.endDate = new Date(end).toISOString();

					return params;
				}

				const form = document.getElementById('tradeProfitForm');
				if (form) {
					form.addEventListener('submit', function(e){
						// allow HTMX to proceed; also trigger chart update
						const params = collectParams();
						// small delay so HTMX starts
						setTimeout(() => {
							if (window.renderTimeSeriesChart) {
								window.renderTimeSeriesChart('timeSeriesChart', params);
							}
						}, 50);
					});
				}

				document.addEventListener('DOMContentLoaded', function(){
					// initial chart render with empty params
					if (window.renderTimeSeriesChart) {
						window.renderTimeSeriesChart('timeSeriesChart', collectParams());
					}
				});
			})();
		</script>
	</body>

</html>

<!DOCTYPE html>
<html data-layout-decorate="~{_components/layout/stockLayout}">

<body>
	<div data-layout-fragment="content-stock">
		stock index




		<h2>Trade Profit (HTMX Test)</h2>

		<form id="tradeProfitForm" class="form" hx-post="/stock/htmx/calculateProfit" hx-target="#tradeProfitResult"
			hx-swap="innerHTML" hx-headers='{"Content-Type":"application/json"}'
			hx-vals='js:JSON.stringify(Object.fromEntries(new FormData(this)))'>

			<div class="form-group">
				<label for="userId">User ID (UUID) <span style="color:red">*</span></label>
				<input type="text" id="userId" name="userId" placeholder="e.g. 123e4567-e89b-12d3-a456-426614174000"
					required class="form-control" />
			</div>

			<div class="form-group">
				<label for="groupBy">Group By</label>
				<select id="groupBy" name="groupBy" class="form-control">
					<option value="ACCOUNT_AND_STOCKITEM" selected>ACCOUNT_AND_STOCKITEM</option>
					<option value="STOCKITEM">STOCKITEM</option>
				</select>
			</div>

			<div class="form-group">
				<label for="accountIds">Account IDs (comma-separated UUIDs)</label>
				<input type="text" id="accountIds" name="accountIds" placeholder="uuid1, uuid2" class="form-control" />
			</div>

			<div class="form-group">
				<label for="stockItemIds">Stock Item IDs (comma-separated UUIDs)</label>
				<input type="text" id="stockItemIds" name="stockItemIds" placeholder="uuid1, uuid2"
					class="form-control" />
			</div>

			<div class="form-group">
				<label for="startDate">Start Date (ISO-8601 with offset)</label>
				<input type="text" id="startDate" name="startDate" placeholder="2025-01-01T00:00:00+09:00"
					class="form-control" />
			</div>

			<div class="form-group">
				<label for="endDate">End Date (ISO-8601 with offset)</label>
				<input type="text" id="endDate" name="endDate" placeholder="2025-01-31T23:59:59+09:00"
					class="form-control" />
			</div>

			<div class="form-group" style="margin-top: 8px;">
				<button type="submit" class="btn btn-primary">Calculate</button>
				<button type="reset" class="btn btn-secondary"
					hx-on:click="document.getElementById('tradeProfitResult').innerHTML=''">
					Reset
				</button>
			</div>
		</form>

		<hr />

		<div id="tradeProfitResult" th:fragment="result">
			<p style="color: #888;">Enter parameters and click Calculate to view results.</p>
		</div>
	</div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="portfolio">
    <div class="overflow-x-auto">
        <table class="table table-hover table-striped w-full">
            <thead>
            <tr class="bg-base-200"
                th:with="sortField=${sort != null ? sort.split(',')[0] : ''}, sortDir=${sort != null && sort.contains(',') ? sort.split(',')[1] : ''}">
                <th class="cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:classappend="${viewGroupBy == 'STOCK' or viewGroupBy == 'ACCOUNT'} ? 'hidden' : ''"
                    th:hx-vals="|{&quot;sort&quot;: &quot;accountName,${sortField == 'accountName' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    계좌 <span th:if="${sortField == 'accountName'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;stockItemName,${sortField == 'stockItemName' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    종목명 <span th:if="${sortField == 'stockItemName'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="text-right cursor-pointer hover:bg-base-300 hidden lg:table-cell" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;holdingQuantity,${sortField == 'holdingQuantity' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    보유수량 <span th:if="${sortField == 'holdingQuantity'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="text-right cursor-pointer hover:bg-base-300 hidden xl:table-cell" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;averageBuyPrice,${sortField == 'averageBuyPrice' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    평균단가 <span th:if="${sortField == 'averageBuyPrice'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="text-right cursor-pointer hover:bg-base-300 hidden lg:table-cell" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;currentPrice,${sortField == 'currentPrice' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    현재가 <span th:if="${sortField == 'currentPrice'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="text-right cursor-pointer hover:bg-base-300 hidden md:table-cell" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;evaluationAmount,${sortField == 'evaluationAmount' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    평가금액 <span th:if="${sortField == 'evaluationAmount'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="text-right cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;evaluationProfit,${sortField == 'evaluationProfit' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    평가손익 <span th:if="${sortField == 'evaluationProfit'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
                <th class="text-right cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/portfolio" hx-target="#tab-content"
                    th:hx-vals="|{&quot;sort&quot;: &quot;realizedProfit,${sortField == 'realizedProfit' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;, &quot;viewGroupBy&quot;: &quot;${viewGroupBy}&quot;}|">
                    실현손익 <span th:if="${sortField == 'realizedProfit'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="item, iterStat : ${tradeProfitList}">
                <tr th:if="${viewGroupBy == 'ACCOUNT' and (iterStat.first or item.accountName != tradeProfitList[iterStat.index - 1].accountName)}">
                    <!-- Distinct Account Header: Primary Tint + Left Align -->
                    <td colspan="8" class="bg-primary/10 font-bold text-left px-4 py-3" th:text="${item.accountName}"></td>
                </tr>
                <tr>
                    <td th:text="${item.accountName}" th:classappend="${viewGroupBy == 'STOCK' or viewGroupBy == 'ACCOUNT'} ? 'hidden' : ''"></td>
                    <td class="font-bold pl-8" th:text="${item.stockItemName}"></td> <!-- Indent Item -->
                    <td class="text-right hidden lg:table-cell text-principal" th:text="${#numbers.formatInteger(item.holdingQuantity, 0, 'COMMA')}"></td>
                    <td class="text-right hidden xl:table-cell text-principal" th:text="${#numbers.formatDecimal(item.averageBuyPrice, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-right hidden lg:table-cell text-principal" th:text="${#numbers.formatDecimal(item.currentPrice, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-right hidden md:table-cell text-principal" th:text="${#numbers.formatDecimal(item.evaluationAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-right font-bold" th:classappend="${item.evaluationProfit >= 0} ? 'text-profit' : 'text-loss'"
                        th:text="${#numbers.formatDecimal(item.evaluationProfit, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-right" th:classappend="${item.realizedProfit >= 0} ? 'text-profit' : 'text-loss'"
                        th:text="${#numbers.formatDecimal(item.realizedProfit, 0, 'COMMA', 0, 'POINT')}"></td>
                </tr>
                <tr class="bg-base-200/50 font-bold border-t border-base-300" th:if="${viewGroupBy == 'ACCOUNT' and (iterStat.last or item.accountName != tradeProfitList[iterStat.index + 1].accountName)}">
                    <td th:classappend="${viewGroupBy == 'STOCK' or viewGroupBy == 'ACCOUNT'} ? 'hidden' : ''"></td>
                    <td class="text-right pr-4">소계</td> <!-- Right Align Label adjacent to values -->
                    <td class="hidden lg:table-cell"></td>
                    <td class="hidden xl:table-cell"></td>
                    <td class="hidden lg:table-cell"></td>
                    <td class="text-right hidden md:table-cell text-principal opacity-80" th:text="${#numbers.formatDecimal(accountTotalMap[item.accountName].evaluationAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-right" th:classappend="${accountTotalMap[item.accountName].evaluationProfit >= 0} ? 'text-profit' : 'text-loss'"
                        th:text="${#numbers.formatDecimal(accountTotalMap[item.accountName].evaluationProfit, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td class="text-right" th:classappend="${accountTotalMap[item.accountName].realizedProfit >= 0} ? 'text-profit' : 'text-loss'"
                        th:text="${#numbers.formatDecimal(accountTotalMap[item.accountName].realizedProfit, 0, 'COMMA', 0, 'POINT')}"></td>
                </tr>
            </th:block>
            </tbody>
            <tfoot>
            <tr class="bg-base-200 font-bold">
                <td th:classappend="${viewGroupBy == 'STOCK' or viewGroupBy == 'ACCOUNT'} ? 'hidden' : ''"></td>
                <td class="text-center">합계</td>
                <td class="hidden lg:table-cell"></td>
                <td class="hidden xl:table-cell"></td>
                <td class="hidden lg:table-cell"></td>
                <td class="text-right hidden md:table-cell text-principal" th:text="${#numbers.formatDecimal(totalEvaluationAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                <td class="text-right" th:classappend="${totalEvaluationProfit >= 0} ? 'text-profit' : 'text-loss'"
                    th:text="${#numbers.formatDecimal(totalEvaluationProfit, 0, 'COMMA', 0, 'POINT')}"></td>
                <td class="text-right" th:classappend="${totalRealizedProfit >= 0} ? 'text-profit' : 'text-loss'"
                    th:text="${#numbers.formatDecimal(totalRealizedProfit, 0, 'COMMA', 0, 'POINT')}"></td>
            </tr>
            </tfoot>
        </table>
    </div>
</div>

<div th:fragment="dividendHistory" id="dividendListFragment">
	<!-- Filter & Search Form -->
	<form id="dividendSearchForm" class="flex flex-wrap gap-2 mb-4 items-end bg-base-100 p-2 rounded-box shadow-sm"
	      hx-get="/stock/htmx/dividend/list" 
	      hx-target="#dividendListContainer" 
	      hx-select="#dividendListContainer"
	      hx-swap="outerHTML"
	      hx-trigger="submit">
		
		<div class="form-control w-full sm:w-auto">
			<label class="label p-1"><span class="label-text text-xs">기간</span></label>
			<div class="join">
				<input type="date" name="startDate" class="input input-sm input-bordered join-item" th:value="${startDate}">
				<input type="date" name="endDate" class="input input-sm input-bordered join-item" th:value="${endDate}">
			</div>
		</div>

		<div class="form-control w-full sm:w-auto">
			<label class="label p-1"><span class="label-text text-xs">계좌</span></label>
			<select name="accountIdList" class="select select-sm select-bordered">
				<option value="">전체</option>
				<option th:each="account : ${accountList}" 
						th:value="${account.id}" 
						th:text="${account.name}"
						th:selected="${account.id == selectedAccountId}"></option>
			</select>
		</div>

		<div class="form-control w-full sm:w-auto">
			<label class="label p-1"><span class="label-text text-xs">종목</span></label>
			<select name="stockItemIdList" class="select select-sm select-bordered">
				<option value="">전체</option>
				<option th:each="stockItem : ${stockItemList}" 
						th:value="${stockItem.id}" 
						th:text="${stockItem.name}"
						th:selected="${stockItem.id == selectedStockItemId}"></option>
			</select>
		</div>
		
		<button type="submit" class="btn btn-sm btn-primary">조회</button>
		<button type="button" class="btn btn-sm text-xs" 
		        hx-get="/stock/htmx/dividend/list" 
		        hx-target="#dividendListFragment" 
		        hx-select="#dividendListFragment"
		        hx-swap="outerHTML">초기화</button>
	</form>

	<div id="dividendListContainer" class="flex flex-col h-full relative">
	    <div class="overflow-x-auto flex-1 min-h-0">
	        <table class="table table-hover table-striped w-full table-sm table-pin-rows">
	            <thead>
	            <tr class="bg-base-200"
	                th:with="sortField=${sort != null ? sort.split(',')[0] : ''}, sortDir=${sort != null && sort.contains(',') ? sort.split(',')[1] : ''}">
	                <th class="cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;payDate,${sortField == 'payDate' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    지급일 <span th:if="${sortField == 'payDate'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	                <th class="cursor-pointer hover:bg-base-300 hidden sm:table-cell" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;accountName,${sortField == 'accountName' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    계좌 <span th:if="${sortField == 'accountName'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	                <th class="cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;stockItemName,${sortField == 'stockItemName' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    종목명 <span th:if="${sortField == 'stockItemName'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	                <th class="text-right cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;grossAmount,${sortField == 'grossAmount' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    배당금(세전) <span th:if="${sortField == 'grossAmount'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	                <th class="text-right cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;netAmount,${sortField == 'netAmount' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    배당금(세후) <span th:if="${sortField == 'netAmount'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	                <th class="text-right cursor-pointer hover:bg-base-300 hidden lg:table-cell" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;tax,${sortField == 'tax' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    세금 <span th:if="${sortField == 'tax'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	                <th class="text-right cursor-pointer hover:bg-base-300" hx-get="/stock/htmx/dividend/list" hx-target="#dividendListContainer" hx-select="#dividendListContainer" hx-swap="outerHTML" hx-include="#dividendSearchForm"
	                    th:hx-vals="|{&quot;sort&quot;: &quot;taxableAmount,${sortField == 'taxableAmount' && sortDir == 'asc' ? 'desc' : 'asc'}&quot;}|">
	                    과세금액 <span th:if="${sortField == 'taxableAmount'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
	                </th>
	            </tr>
	            </thead>
	            <tbody>
	            <tr th:each="item : ${dividendList}">
	                <td th:text="${#temporals.format(item.payDate, 'yyyy-MM-dd')}"></td>
	                <td class="hidden sm:table-cell" th:text="${item.accountName}"></td>
	                <td class="font-bold" th:text="${item.stockItemName}"></td>
	                <td class="text-right" th:text="${#numbers.formatDecimal(item.grossAmount, 0, 'COMMA', 0, 'POINT')}"></td>
	                <td class="text-right text-dividend font-bold" th:text="${#numbers.formatDecimal(item.netAmount, 0, 'COMMA', 0, 'POINT')}"></td>
	                <td class="text-right hidden lg:table-cell" th:text="${#numbers.formatDecimal(item.tax, 0, 'COMMA', 0, 'POINT')}"></td>
	                <td class="text-right" th:text="${#numbers.formatDecimal(item.taxableAmount, 0, 'COMMA', 0, 'POINT')}"></td>
	            </tr>
	            <tr th:if="${#lists.isEmpty(dividendList)}">
		          	<td colspan="7" class="text-center py-10 opacity-50">배당 내역이 없습니다.</td>
		        </tr>
	            </tbody>
	            <!-- Footer -->
				<tfoot>
					<tr class="font-bold bg-base-200">
						<td colspan="3" class="text-center sm:text-right sm:pr-4">합계</td>
						<td class="text-right font-mono" th:text="${#numbers.formatDecimal(totalGrossAmount, 0, 'COMMA', 0, 'POINT')}">0</td>
						<td class="text-right font-mono text-dividend" th:text="${#numbers.formatDecimal(totalNetAmount, 0, 'COMMA', 0, 'POINT')}">0</td>
						<td class="text-right font-mono hidden lg:table-cell" th:text="${#numbers.formatDecimal(totalTax, 0, 'COMMA', 0, 'POINT')}">0</td>
						<td class="text-right font-mono" th:text="${#numbers.formatDecimal(totalTaxableAmount, 0, 'COMMA', 0, 'POINT')}">0</td>
					</tr>
				</tfoot>
	        </table>
	    </div>
	    
	    <!-- Pagination -->
		<div class="flex justify-center p-2 border-t border-base-200 bg-base-100" th:if="${pagination.totalPage > 1}">
			<div class="join">
				<!-- First -->
				<button class="join-item btn btn-sm" 
				        th:classappend="${!pagination.firstNav.isActive} ? 'btn-disabled'"
				        th:disabled="${!pagination.firstNav.isActive}"
				        hx-get="/stock/htmx/dividend/list" 
				        hx-include="#dividendSearchForm"
				        th:hx-vals="${'{&quot;page&quot;: ' + pagination.firstNav.page + '}'}"
				        hx-target="#dividendListContainer"
				        hx-select="#dividendListContainer"
				        hx-swap="outerHTML">≪</button>
				        
				<!-- Previous -->
				<button class="join-item btn btn-sm" 
				        th:classappend="${!pagination.prevNav.isActive} ? 'btn-disabled'"
				        th:disabled="${!pagination.prevNav.isActive}"
				        hx-get="/stock/htmx/dividend/list"
				        hx-include="#dividendSearchForm"
				        th:hx-vals="${'{&quot;page&quot;: ' + pagination.prevNav.page + '}'}"
				        hx-target="#dividendListContainer"
				        hx-select="#dividendListContainer"
				        hx-swap="outerHTML">&lt;</button>

				<!-- Page Numbers -->
				<button class="join-item btn btn-sm" 
				        th:each="nav : ${pagination.navList}"
				        th:text="${nav.page}"
				        th:classappend="${nav.isActive} ? 'btn-active'"
				        hx-get="/stock/htmx/dividend/list"
				        hx-include="#dividendSearchForm"
				        th:hx-vals="${'{&quot;page&quot;: ' + nav.page + '}'}"
				        hx-target="#dividendListContainer"
				        hx-select="#dividendListContainer"
				        hx-swap="outerHTML"></button>

				<!-- Next -->
				<button class="join-item btn btn-sm" 
				        th:classappend="${!pagination.nextNav.isActive} ? 'btn-disabled'"
				        th:disabled="${!pagination.nextNav.isActive}"
				        hx-get="/stock/htmx/dividend/list"
				        hx-include="#dividendSearchForm"
				        th:hx-vals="${'{&quot;page&quot;: ' + pagination.nextNav.page + '}'}"
				        hx-target="#dividendListContainer"
				        hx-select="#dividendListContainer"
				        hx-swap="outerHTML">&gt;</button>
				        
				<!-- Last -->
				<button class="join-item btn btn-sm" 
				        th:classappend="${!pagination.lastNav.isActive} ? 'btn-disabled'"
				        th:disabled="${!pagination.lastNav.isActive}"
				        hx-get="/stock/htmx/dividend/list"
				        hx-include="#dividendSearchForm"
				        th:hx-vals="${'{&quot;page&quot;: ' + pagination.lastNav.page + '}'}"
				        hx-target="#dividendListContainer"
				        hx-select="#dividendListContainer"
				        hx-swap="outerHTML">≫</button>
			</div>
		</div>
	</div>
</div>

</body>
</html>

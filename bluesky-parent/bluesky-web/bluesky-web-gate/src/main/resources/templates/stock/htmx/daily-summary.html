<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- 1. Main Daily Summary Container -->
<div th:fragment="container">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-4 space-y-4">
            
            <!-- Filters Form -->
            <form id="daily-summary-filter-form" 
                  hx-get="/stock/htmx/daily-summary/data" 
                  hx-target="#daily-summary-content" 
                  hx-trigger="submit, change delay:200ms, load"
                  hx-indicator="#daily-summary-loading"
                  class="flex flex-col gap-3">

                <!-- Top Control Panel -->
                <div class="flex flex-col xl:flex-row items-center justify-between gap-4 p-4 bg-base-200 rounded-box shadow-sm">
                    
                    <!-- Left: Type & Period -->
                    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 w-full xl:w-auto">
                        <!-- Type -->
                        <div class="join shadow-sm">
                            <input class="join-item btn btn-sm" type="radio" name="type" value="PROFIT" aria-label="매매/보유 손익" checked onclick="updateDailySummaryUI()"/>
                            <input class="join-item btn btn-sm" type="radio" name="type" value="DIVIDEND" aria-label="배당 내역" onclick="updateDailySummaryUI()"/>
                        </div>
                        
                        <!-- Separator (Visual) -->
                        <div class="hidden sm:block w-px h-6 bg-base-content/20"></div>

                        <!-- Period -->
                        <div class="join shadow-sm" id="period-group">
                            <input class="join-item btn btn-sm" type="radio" name="timeScale" value="TOTAL" id="period-total" aria-label="누적(전체)" checked onclick="updateDailySummaryUI()"/>
                            <input class="join-item btn btn-sm" type="radio" name="timeScale" value="YEARLY" id="period-yearly" aria-label="연도별" onclick="updateDailySummaryUI()"/>
                            <input class="join-item btn btn-sm" type="radio" name="timeScale" value="MONTHLY" id="period-monthly" aria-label="월별" onclick="updateDailySummaryUI()"/>
                        </div>
                    </div>

                    <!-- Right: Grouping & Selects -->
                    <div class="flex flex-wrap items-center justify-center gap-2 w-full xl:w-auto">
                        <!-- Grouping -->
                        <div class="join shadow-sm mr-2">
                            <input class="join-item btn btn-sm" type="radio" name="groupBy" value="STOCK" aria-label="종목별" onclick="updateDailySummaryUI()"/>
                            <input class="join-item btn btn-sm" type="radio" name="groupBy" value="ACCOUNT" aria-label="계좌별" onclick="updateDailySummaryUI()"/>
                            <input class="join-item btn btn-sm" type="radio" name="groupBy" value="SUMMARY" aria-label="합계" checked onclick="updateDailySummaryUI()"/>
                        </div>

                        <!-- Year Filter -->
                        <select name="year" id="filter-year" class="select select-bordered select-sm w-24" style="display:none;" onchange="updateDailySummaryUI()">
                            <option th:each="y : ${years}" th:value="${y}" th:text="${y + '년'}" th:selected="${y == currentYear}">2025년</option>
                        </select>

                        <!-- Month Filter -->
                        <select name="month" id="filter-month" class="select select-bordered select-sm w-20" style="display:none;" onchange="updateDailySummaryUI()">
                            <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m + '월'}" th:selected="${m == currentMonth}">1월</option>
                        </select>

                        <!-- Account Filter -->
                        <select name="accountId" id="filter-account" class="select select-bordered select-sm w-auto" onchange="updateDailySummaryUI()">
                            <option value="">전체 계좌</option>
                            <option th:each="acc : ${accounts}" 
                                    th:value="${acc.id}" 
                                    th:text="${acc.name}">계좌명</option>
                        </select>
                    </div>

                </div>
                
                <!-- Loading Overlay -->
                <div id="daily-summary-loading" class="htmx-indicator hidden flex justify-center py-2">
                    <span class="loading loading-spinner text-secondary"></span>
                </div>

                <script src="/js/stock/dailySummary.js"></script>

            </form>
        </div>
    </div>

    <!-- Data Content Area -->
    <div id="daily-summary-content" class="mt-4 min-h-[300px]">
        <div class="flex justify-center py-10">
            <span class="loading loading-spinner text-primary"></span>
        </div>
    </div>
</div>

<!-- 2. Data Content Fragment -->
<div th:fragment="data-content" class="flex flex-col gap-6 animate-fade-in"
     xmlns:th="http://www.thymeleaf.org">
    
    <!-- Chart Area -->
    <div class="card bg-base-100 shadow-xl w-full">
        <div class="card-body">
            <h2 class="card-title text-sm opacity-70" th:text="${chartTitle}">분석 차트</h2>
            <div class="h-[300px] w-full relative">
                 <canvas id="dailySummaryChart"></canvas>
            </div>
            <div class="text-xs text-right opacity-50 mt-2">* 상위 20개 항목만 표시됩니다.</div>
        </div>
    </div>

    <!-- Summary Table Area -->
    <div class="card bg-base-100 shadow-xl w-full">
        <div class="card-body overflow-x-auto p-0 scrollbar-thin">
            <table class="table table-sm table-pin-rows">
                <thead>
                    <tr class="bg-base-200">
                        <th th:text="${keyLabel}">항목</th>
                        <!-- Dynamic Sub Key -->
                        <th th:if="${subKeyLabel != null}" th:text="${subKeyLabel}">세부</th>
                        <th class="text-right" th:text="${value1Label}">금액1</th>
                        <th class="text-right" th:if="${value2Label != null && !value2Label.isEmpty()}" th:text="${value2Label}">금액2</th>
                        <th class="text-right" th:if="${value3Label != null && !value3Label.isEmpty()}" th:text="${value3Label}">금액3</th>
                        <th class="text-right" th:if="${value4Label != null && !value4Label.isEmpty()}" th:text="${value4Label}">금액4</th>
                        <th class="text-right" th:if="${value5Label != null && !value5Label.isEmpty()}" th:text="${value5Label}">금액5</th>
                        <th class="text-right" th:if="${value6Label != null && !value6Label.isEmpty()}" th:text="${value6Label}">금액6</th>
                        <th class="text-right" th:if="${totalLabel != null && !totalLabel.isEmpty()}" th:text="${totalLabel}">합계</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${tableData}" class="hover">
                        <td class="font-medium" th:text="${row.key}">항목</td>
                        <td class="text-sm opacity-80" th:if="${subKeyLabel != null}" th:text="${row.subKey}">세부</td>
                        
                        <!-- Value 1 -->
                        <td class="text-right font-mono whitespace-nowrap" 
                            th:text="${#numbers.formatDecimal(row.value1, 0, 'COMMA', 0, 'POINT')}"
                            th:classappend="${row.value1 >= 0} ? 'text-primary' : 'text-error'">
                            0
                        </td>

                        <!-- Value 2 (Optional) -->
                       <td class="text-right font-mono whitespace-nowrap" 
                            th:if="${value2Label != null && !value2Label.isEmpty()}" 
                            th:text="${#numbers.formatDecimal(row.value2, 0, 'COMMA', 0, 'POINT')}"
                            th:classappend="${row.value2 >= 0} ? 'text-secondary' : 'text-error'">
                            0
                        </td>

                        <!-- Value 3 (Optional) -->
                       <td class="text-right font-mono whitespace-nowrap" 
                            th:if="${value3Label != null && !value3Label.isEmpty()}" 
                            th:text="${#numbers.formatDecimal(row.value3, 0, 'COMMA', 0, 'POINT')}"
                            th:classappend="${row.value3 >= 0} ? 'text-accent' : 'text-error'">
                            0
                        </td>

                        <!-- Value 4 -->
                       <td class="text-right font-mono whitespace-nowrap" 
                            th:if="${value4Label != null && !value4Label.isEmpty()}" 
                            th:text="${#numbers.formatDecimal(row.value4, 0, 'COMMA', 0, 'POINT')}"
                             th:classappend="${row.value4 >= 0 ? 'text-success' : 'text-error'}">
                            0
                        </td>

                        <!-- Value 5 -->
                       <td class="text-right font-mono whitespace-nowrap" 
                            th:if="${value5Label != null && !value5Label.isEmpty()}" 
                            th:text="${#numbers.formatDecimal(row.value5, 0, 'COMMA', 0, 'POINT')}">
                            0
                        </td>

                        <!-- Value 6 -->
                       <td class="text-right font-mono whitespace-nowrap" 
                            th:if="${value6Label != null && !value6Label.isEmpty()}" 
                            th:text="${#numbers.formatDecimal(row.value6, 0, 'COMMA', 0, 'POINT')}"
                             th:classappend="${row.value6 >= 0 ? 'text-primary' : 'text-error'}">
                            0
                        </td>

                        <!-- Total (Conditional) -->
                        <td class="text-right font-bold text-base-content whitespace-nowrap" 
                             th:if="${totalLabel != null && !totalLabel.isEmpty()}"
                             th:text="${#numbers.formatDecimal(row.total != null ? row.total : (row.value4 + row.value6), 0, 'COMMA', 0, 'POINT')}"
                              th:classappend="${(row.total != null ? row.total : (row.value4 + row.value6)) >= 0 ? 'text-success' : 'text-error'}">
                             0
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tableData)}">
                        <td colspan="7" class="text-center py-10 text-base-content/50">
                            <div>데이터가 없습니다.</div>
                            <div class="text-xs mt-1">기간이나 조건을 변경해보세요.</div>
                        </td>
                    </tr>
                </tbody>
                <!-- Footer Total -->
                <tfoot th:if="${not #lists.isEmpty(tableData)}">
                    <tr class="bg-base-200 font-bold">
                        <td th:colspan="${subKeyLabel != null ? 2 : 1}">합계</td>
                        
                         <!-- Total Value 1 (Quantity) -->
                         <td class="text-right text-primary" 
                             th:text="${#numbers.formatDecimal(#aggregates.sum(tableData.![value1]), 0, 'COMMA', 0, 'POINT')}">
                        </td>

                         <!-- Total Value 2 (Avg Price - N/A) -->
                         <td class="text-right text-secondary" 
                             th:if="${value2Label != null && !value2Label.isEmpty()}">
                             -
                        </td>

                         <!-- Total Value 3 (Eval) -->
                         <td class="text-right text-accent" 
                             th:if="${value3Label != null && !value3Label.isEmpty()}"
                             th:text="${#numbers.formatDecimal(#aggregates.sum(tableData.![value3]), 0, 'COMMA', 0, 'POINT')}">
                        </td>

                         <!-- Total Value 4 (Unrealized) -->
                         <td class="text-right" 
                             th:if="${value4Label != null && !value4Label.isEmpty()}"
                             th:text="${#numbers.formatDecimal(#aggregates.sum(tableData.![value4]), 0, 'COMMA', 0, 'POINT')}"
                             th:classappend="${#aggregates.sum(tableData.![value4]) >= 0 ? 'text-success' : 'text-error'}">
                        </td>

                         <!-- Total Value 5 (Sell) -->
                         <td class="text-right" 
                             th:if="${value5Label != null && !value5Label.isEmpty()}"
                             th:text="${#numbers.formatDecimal(#aggregates.sum(tableData.![value5]), 0, 'COMMA', 0, 'POINT')}">
                        </td>

                         <!-- Total Value 6 (Realized) -->
                         <td class="text-right" 
                             th:if="${value6Label != null && !value6Label.isEmpty()}"
                             th:text="${#numbers.formatDecimal(#aggregates.sum(tableData.![value6]), 0, 'COMMA', 0, 'POINT')}"
                             th:classappend="${#aggregates.sum(tableData.![value6]) >= 0 ? 'text-primary' : 'text-error'}">
                        </td>

                        <!-- Grand Total (Conditional) -->
                        <td class="text-right text-base-content font-bold" 
                            th:if="${totalLabel != null && !totalLabel.isEmpty()}"
                            th:text="${#numbers.formatDecimal(totalValue, 0, 'COMMA', 0, 'POINT')}"
                            th:classappend="${totalValue >= 0} ? 'text-success' : 'text-error'">
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
        (function() {
            // Safe cleanup
            var chartId = 'dailySummaryChart';
            var existingChart = Chart.getChart(chartId);
            if (existingChart) {
                existingChart.destroy();
            }

            var ctx = document.getElementById(chartId);
            if(!ctx) return;

            var labels = /*[[${chartLabels}]]*/ [];
            var datasets = /*[[${chartDatasets}]]*/ [];
            var chartType = /*[[${chartType}]]*/ 'bar';
            var isStacked = /*[[${isStacked}]]*/ false;
            var taxableTotals = /*[[${taxableTotals}]]*/ [];
            
            // Fallback for single dataset structure if legacy data passed (compability)
            var singleData = /*[[${chartData}]]*/ null;
            if((!datasets || datasets.length === 0) && singleData) {
                 var label = /*[[${valueLabel}]]*/ 'Value';
                 datasets = [{
                    label: label,
                    data: singleData,
                    backgroundColor: singleData.map(v => v >= 0 ? 'rgba(54, 162, 235, 0.6)' : 'rgba(255, 99, 132, 0.6)'),
                    borderColor: singleData.map(v => v >= 0 ? 'rgba(54, 162, 235, 1)' : 'rgba(255, 99, 132, 1)'),
                    borderWidth: 1
                }];
            }

            // Fix: Wait for layout to settle to avoid clipping
            setTimeout(function() {
                new Chart(ctx, {
                    type: chartType, 
                    data: {
                        labels: labels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            padding: {
                                right: 20, // Prevent cut-off
                                left: 10
                            }
                        },
                        datasets: {
                            bar: {
                                maxBarThickness: 60
                            }
                        },
                        scales: {
                            y: { 
                                beginAtZero: true,
                                stacked: isStacked
                            },
                            x: {
                                stacked: isStacked,
                                offset: true, // Important for Line chart to show first/last points fully
                                ticks: {
                                    autoSkip: false // Force show all labels if possible
                                }
                            }
                        },
                        plugins: {
                            legend: { display: datasets.length > 1 },
                            tooltip: {
                                filter: function(tooltipItem) {
                                    return tooltipItem.parsed.y !== 0;
                                },
                                callbacks: {
                                    footer: function(tooltipItems) {
                                        let sum = 0;
                                        tooltipItems.forEach(function(tooltipItem) {
                                            sum += tooltipItem.parsed.y;
                                        });
                                        let footerText = '합계: ' + sum.toLocaleString();
                                        
                                        if (taxableTotals && taxableTotals.length > 0) {
                                            let index = tooltipItems[0].dataIndex;
                                            let taxableSum = taxableTotals[index] || 0;
                                            footerText += '\n과세금액: ' + taxableSum.toLocaleString();
                                        }
                                        return footerText;
                                    }
                                }
                            }
                        },
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        }
                    }
                });
            }, 100);
        })();
    /*]]>*/
    </script>
</div>

</body>
</html>

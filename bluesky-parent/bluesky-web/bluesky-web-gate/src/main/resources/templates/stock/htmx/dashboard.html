<!DOCTYPE html>
<html lang="ko" data-layout-decorate="~{_layout/stockLayout}">
<head>
    <title>Stock Dashboard</title>
</head>
<body>
<div data-layout-fragment="content-stock">
    <!-- Dashboard Layout -->
    <div class="container mx-auto p-4 space-y-6">
        
        <!-- 1. Summary Cards (Lazy Load) -->
        <div hx-get="/stock/htmx/summary" hx-trigger="load" hx-swap="innerHTML">
            <div class="flex justify-center p-4">
                <span class="loading loading-spinner loading-lg"></span>
            </div>
        </div>

        <!-- 2. Charts (Lazy Load) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div hx-get="/stock/htmx/charts/allocation" hx-trigger="load" hx-swap="outerHTML">
                <div class="skeleton h-64 w-full"></div>
            </div>
            <div hx-get="/stock/htmx/charts/dividend" hx-trigger="load" hx-swap="outerHTML">
                <div class="skeleton h-64 w-full"></div>
            </div>
        </div>

        <!-- 3. Details Tabs -->
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <div role="tablist" class="tabs tabs-boxed mb-4">
                    <a role="tab" class="tab tab-active" 
                    hx-get="/stock/htmx/portfolio" 
                    hx-target="#tab-content" 
                    hx-swap="innerHTML"
                    onclick="document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab-active')); this.classList.add('tab-active');">
                    Portfolio
                    </a>
                    <a role="tab" class="tab" 
                    hx-get="/stock/htmx/dividend/list" 
                    hx-target="#tab-content" 
                    hx-swap="innerHTML"
                    onclick="document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab-active')); this.classList.add('tab-active');">
                    Dividend History
                    </a>
                </div>
                
                <div id="tab-content" hx-get="/stock/htmx/portfolio" hx-trigger="load">
                    <div class="flex justify-center p-10">
                        <span class="loading loading-dots loading-lg"></span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>

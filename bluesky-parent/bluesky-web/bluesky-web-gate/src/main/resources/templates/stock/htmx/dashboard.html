<!DOCTYPE html>
<html lang="ko" data-layout-decorate="~{_layout/stockLayout}">
<head>
    <title>주식 대시보드</title>
</head>
<body>
<div data-layout-fragment="content-stock" th:fragment="dashboardContent">
    <!-- Chart.js is required for chart fragments -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Dashboard Layout -->
    <div class="container mx-auto p-4 space-y-6">
    
 		<!-- Admin Actions -->
		<div class="card bg-base-100 shadow-xl mb-6" th:if="${userId != null}">
			<div class="card-body">
				<h2 class="card-title text-2xl mb-4">데이터 관리</h2>
				<div class="flex flex-wrap gap-4">
					<button th:attr="hx-post=@{'/api/stock/admin/stock-items?userId=' + ${userId}}"
							hx-swap="none"
							class="btn btn-secondary gap-2"
							onclick="if(!confirm('주식 종목 정보를 갱신하시겠습니까?')) return false;">
						종목 갱신 (Stock Items)
					</button>
					<button th:attr="hx-post=@{'/api/stock/admin/trades?userId=' + ${userId}}"
							hx-swap="none"
							class="btn btn-secondary gap-2"
							onclick="if(!confirm('매매 내역을 갱신하시겠습니까?')) return false;">
						매매 내역 갱신 (Trades)
					</button>
					<button th:attr="hx-post=@{'/api/stock/admin/dividends?userId=' + ${userId}}"
							hx-swap="none"
							class="btn btn-secondary gap-2"
							onclick="if(!confirm('배당 내역을 갱신하시겠습니까?')) return false;">
						배당 내역 갱신 (Dividends)
					</button>
				</div>
			</div>
		</div>
        
        <!-- 1. Summary Cards (Lazy Load) -->
        <div hx-get="/stock/htmx/summary" hx-trigger="load" hx-swap="innerHTML">
            <div class="flex justify-center p-4">
                <span class="loading loading-spinner loading-lg"></span>
            </div>
        </div>

        <!-- 2. Advanced Analytics (Multi-dimensional Analysis) -->
        <div hx-get="/stock/htmx/daily-summary/view" hx-trigger="load" hx-swap="outerHTML">
             <div class="flex justify-center p-10">
                <span class="loading loading-spinner loading-lg"></span>
            </div>
        </div>



    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout/stockLayout}">

<head>
	<title>주식 손익 대시보드</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script data-th-src="@{/js/stock/tradeProfit.js}" defer></script>
</head>

<body>
	<div data-layout-fragment="content-stock" class="container mx-auto px-4 py-8">
		<div class="max-w-7xl mx-auto">
			<!-- 로그인 필요 메시지 -->
			<div sec:authorize="isAnonymous()" class="alert alert-warning mb-6">
				<svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none"
					viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
						d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
				</svg>
				<div>
					<h3 class="font-bold">로그인이 필요합니다</h3>
					<div class="text-xs">주식 손익 대시보드를 조회하려면 <a data-th-href="@{/login}" class="link link-primary">로그인</a>해주세요.</div>
				</div>
			</div>

			<!-- 헤더 -->
			<div class="mb-8">
				<h1 class="text-4xl font-bold mb-2">주식 손익 대시보드</h1>
				<p class="text-gray-600">시각화된 손익 분석과 통계</p>
			</div>

			<!-- 조회 폼 -->
			<div class="card bg-base-100 shadow-xl mb-8">
				<div class="card-body">
					<h2 class="card-title mb-4">조회 조건</h2>
					<form
						id="dashboardForm"
						hx-get="/stock/htmx/dashboard"
						hx-target="#dashboardResult"
						hx-indicator="#dashboardIndicator"
						hx-swap="innerHTML">

						<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
							<!-- 그룹화 방식 -->
							<div class="form-control">
								<label class="label">
									<span class="label-text font-semibold">그룹화</span>
								</label>
								<select name="groupBy" class="select select-bordered w-full">
									<option value="ACCOUNT_AND_STOCKITEM">계좌 + 종목별</option>
									<option value="STOCKITEM">종목별</option>
								</select>
							</div>

							<!-- 시작일 -->
							<div class="form-control">
								<label class="label">
									<span class="label-text font-semibold">시작일</span>
								</label>
								<input type="date" name="startDate" class="input input-bordered w-full" />
							</div>

							<!-- 종료일 -->
							<div class="form-control">
								<label class="label">
									<span class="label-text font-semibold">종료일</span>
								</label>
								<input type="date" name="endDate" class="input input-bordered w-full" />
							</div>
						</div>

						<div class="mt-6 flex justify-end">
							<button type="submit" class="btn btn-primary btn-wide">
								<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none"
									viewBox="0 0 24 24" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
										d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
								</svg>
								대시보드 조회
							</button>
						</div>
					</form>

					<!-- 로딩 인디케이터 -->
					<div id="dashboardIndicator" class="text-center my-10 hidden">
						<span class="loading loading-ring loading-lg"></span>
						<p class="mt-4 text-gray-600">데이터를 분석하고 있습니다...</p>
					</div>
				</div>
			</div>

			<!-- 대시보드 결과 영역 -->
			<div id="dashboardResult">
				<div class="alert alert-info">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
						class="stroke-current shrink-0 w-6 h-6">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
					</svg>
					<span>조건을 선택하고 '대시보드 조회' 버튼을 클릭하세요.</span>
				</div>
			</div>
		</div>
	</div>
</body>

</html>

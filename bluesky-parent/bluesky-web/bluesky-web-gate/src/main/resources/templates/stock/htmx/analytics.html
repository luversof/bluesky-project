<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="container">
    <div class="flex flex-col gap-6">
        <!-- Tabs -->
        <div class="tabs tabs-boxed bg-base-200 p-1">
             <a class="tab tab-lg flex-1 transition-all duration-300 tab-active font-bold" 
                id="tab-profit" 
                onclick="selectAnalyticsTab('PROFIT')">자산 성장</a>
             <a class="tab tab-lg flex-1 transition-all duration-300 font-bold" 
                id="tab-dividend" 
                onclick="selectAnalyticsTab('DIVIDEND')">배당 추이</a>
        </div>

        <!-- Filter Form -->
        <form id="analytics-filter-form"
              hx-get="/stock/htmx/analytics/data"
              hx-target="#analytics-content"
              hx-trigger="submit, change delay:200ms, load">
              
            <!-- Hidden Type -->
            <input type="hidden" name="type" id="input-type" value="PROFIT">
            
            <div class="flex flex-wrap gap-4 items-center justify-between bg-base-100 p-2 rounded-lg border border-base-200">
                 <!-- Time Scale -->
                 <div class="join shadow-sm">
                    <input class="join-item btn btn-sm" type="radio" name="timeScale" value="YEARLY" aria-label="연도별 흐름" checked onchange="updateAnalyticsVis()"/>
                    <input class="join-item btn btn-sm" type="radio" name="timeScale" value="MONTHLY" aria-label="월별 상세" onchange="updateAnalyticsVis()"/>
                    <input class="join-item btn btn-sm" type="radio" name="timeScale" value="TOTAL" aria-label="전체 누적" onchange="updateAnalyticsVis()"/>
                 </div>

                 <!-- Details -->
                 <div class="flex gap-2 items-center">
                     <select name="year" id="select-year" class="select select-bordered select-sm" onchange="updateAnalyticsVis()">
                         <option th:each="y : ${years}" th:value="${y}" th:text="${y}+'년'" th:selected="${y==currentYear}"></option>
                     </select>
                     
                     <select name="month" id="select-month" class="select select-bordered select-sm" style="display:none;" onchange="updateAnalyticsVis()">
                         <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}+'월'" th:selected="${m==currentMonth}"></option>
                     </select>

                     <!-- Separator -->
                     <div class="w-px h-6 bg-base-300 mx-2"></div>

                     <!-- Group By -->
                     <div class="join shadow-sm">
                        <input class="join-item btn btn-sm" type="radio" name="groupBy" value="STOCK" aria-label="종목별" checked onchange="htmx.trigger('#analytics-filter-form', 'submit')"/>
                        <input class="join-item btn btn-sm" type="radio" name="groupBy" value="ACCOUNT" aria-label="계좌별" onchange="htmx.trigger('#analytics-filter-form', 'submit')"/>
                    </div>
                 </div>
            </div>
        </form>

        <!-- Content -->
        <div id="analytics-content" class="min-h-[600px] flex flex-col gap-4">
             <div class="flex justify-center p-20">
                <span class="loading loading-spinner text-primary loading-lg"></span>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script>
        function selectAnalyticsTab(type) {
            // UI Update
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('tab-active', 'bg-primary', 'text-primary-content'));
            const activeTab = document.getElementById('tab-' + type.toLowerCase());
            if(activeTab) activeTab.classList.add('tab-active', 'bg-primary', 'text-primary-content');
            
            // Value Update
            document.getElementById('input-type').value = type;
            
            // Trigger
            htmx.trigger('#analytics-filter-form', 'submit');
        }

        function updateAnalyticsVis() {
            const timeScaleElement = document.querySelector('input[name="timeScale"]:checked');
            if(!timeScaleElement) return;

            const timeScale = timeScaleElement.value;
            const yearSelect = document.getElementById('select-year');
            const monthSelect = document.getElementById('select-month');
            
            if (timeScale === 'TOTAL') {
                 yearSelect.style.display = 'none';
                 monthSelect.style.display = 'none';
            } else if (timeScale === 'YEARLY') {
                 yearSelect.style.display = 'inline-block';
                 monthSelect.style.display = 'none';
            } else {
                 yearSelect.style.display = 'inline-block';
                 monthSelect.style.display = 'inline-block';
            }
            htmx.trigger('#analytics-filter-form', 'submit');
        }
    </script>
</div>


<!-- 2. Data Content Fragment (Loaded via HTMX) -->
<div th:fragment="data-content" class="fade-in space-y-6">

    <!-- 1. Stats Summary -->
    <div class="stats shadow w-full bg-base-100">
        <div class="stat">
            <div class="stat-figure text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
            </div>
            <div class="stat-title" th:text="${totalLabel}">총 합계</div>
            <div class="stat-value" th:text="${totalValue}">0</div>
            <div class="stat-desc">선택 기간/기준</div>
        </div>
        
        <div class="stat">
            <div class="stat-figure text-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            </div>
            <div class="stat-title">데이터 포인트</div>
            <div class="stat-value text-secondary" th:text="${#lists.size(tableData)} + ' 개'">0 개</div>
            <div class="stat-desc">상세 내역 수</div>
        </div>
    </div>

    <!-- 2. Chart Area (Large) -->
    <div class="card bg-base-100 shadow-xl overflow-hidden">
        <div class="card-body p-4 sm:p-6" style="min-height: 400px;">
            <h2 class="card-title text-base opacity-70 mb-4" th:text="${chartType == 'bar' ? '기간별 추이 (Bar)' : '누적 성장 (Line)'}">차트 분석</h2>
            <div class="relative w-full h-[350px] sm:h-[450px]">
                <canvas th:id="${canvasId}"></canvas>
            </div>
        </div>
    </div>

    <!-- 3. Detailed Data Table -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-0 overflow-x-auto">
            <table class="table table-zebra w-full text-center">
                <!-- Head -->
                <thead class="bg-base-200">
                    <tr>
                        <th class="w-16">No</th>
                        <th th:text="${value4Label != null ? value4Label : '날짜'}">날짜</th>
                        <th class="text-left">항목/계좌</th>
                        <th class="text-right">거래/평가금액</th>
                        <th class="text-right font-bold">실현손익</th>
                        <th class="text-right hidden sm:table-cell">평가손익</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(tableData)}">
                        <td colspan="6" class="py-6 text-base-content/50">데이터가 없습니다.</td>
                    </tr>
                    <tr th:each="row, stat : ${tableData}" class="hover">
                        <td th:text="${stat.count}">1</td>
                        <td class="font-mono text-sm" th:text="${row.key}">2023-10</td>
                        <td class="text-left font-bold truncate max-w-[150px]" th:title="${row.subKey}" 
                            th:text="${row.subKey}">삼성전자</td>
                        <!-- 금액 (매도/평가) - Value5 -->
                        <td class="text-right font-mono text-sm" 
                            th:text="${#numbers.formatDecimal(row.value5 != null ? row.value5 : 0, 0, 'COMMA', 0, 'POINT')}">1,000,000</td>
                        <!-- 수익금 (실현) - Value1 -->
                        <td class="text-right font-mono font-bold text-sm" 
                            th:classappend="${row.value1 >= 0 ? 'text-profit' : 'text-loss'}"
                            th:text="${#numbers.formatDecimal(row.value1, 0, 'COMMA', 0, 'POINT')}">+50,000</td>
                        <!-- 수익(평가) - Value2 -->
                        <td class="text-right font-mono text-sm hidden sm:table-cell" 
                            th:classappend="${row.value2 >= 0 ? 'text-profit' : 'text-loss'}"
                            th:text="${#numbers.formatDecimal(row.value2, 0, 'COMMA', 0, 'POINT')}">+5.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Chart Script -->
    <script th:inline="javascript">
        (function() {
            const chartId = /*[[${canvasId}]]*/ 'analyticsChart';
            const ctx = document.getElementById(chartId);
            if(!ctx) return;
            
            // Cleanup just in case
            const existingChart = Chart.getChart(ctx);
            if(existingChart) existingChart.destroy();

            const labels = /*[[${chartLabels}]]*/ [];

            const datasets = /*[[${chartDatasets}]]*/ [];
            const type = /*[[${chartType}]]*/ 'line';

            // Convert dataset colors/logic if needed
            const chartData = {
                labels: labels,
                datasets: datasets.map(ds => ({
                    label: ds.label,
                    data: ds.data,
                    borderColor: ds.borderColor,
                    backgroundColor: ds.backgroundColor,
                    borderWidth: ds.borderWidth,
                    tension: 0.3,
                    fill: false // Line chart defaults to no fill for trend
                }))
            };

            new Chart(ctx, {
                type: type, // 'line' or 'bar'
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { usePointStyle: true, boxWidth: 8 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('ko-KR').format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(0, 0, 0, 0.05)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        })();
    </script>
</div>

</body>
</html>

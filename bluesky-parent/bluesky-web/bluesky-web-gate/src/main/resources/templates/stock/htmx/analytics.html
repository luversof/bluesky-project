<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 1. Main Analytics Container -->
<div th:fragment="container">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-4 space-y-4">
            
            <!-- Filters Form -->
            <form id="analytics-filter-form" 
                  hx-get="/stock/htmx/analytics/data" 
                  hx-target="#analytics-content" 
                  hx-trigger="submit, change delay:200ms, load"
                  class="flex flex-col gap-4">

                <!-- Level 1: Main Category (Tab Style) -->
                <div class="tabs tabs-boxed w-full grid grid-cols-2">
                    <input type="radio" name="type" value="PROFIT" class="tab col-span-1" aria-label="매매/보유 손익" checked 
                           onclick="document.getElementById('period-monthly').disabled = false;"/>
                    <input type="radio" name="type" value="DIVIDEND" class="tab col-span-1" aria-label="배당 내역"
                           onclick="document.getElementById('period-monthly').disabled = false;"/>
                </div>

                <!-- Level 2 & 3 Container -->
                <div class="flex flex-wrap gap-4 items-center justify-between bg-base-200 p-3 rounded-lg">
                    
                    <!-- Level 2: Time Period -->
                    <div class="flex flex-col gap-1">
                        <span class="text-xs font-bold opacity-60 ml-1">기간 기준</span>
                        <div class="join">
                            <input class="join-item btn btn-sm" type="radio" name="timeScale" value="TOTAL" aria-label="누적(전체)" checked />
                            <input class="join-item btn btn-sm" type="radio" name="timeScale" value="YEARLY" aria-label="연도별" />
                            <input class="join-item btn btn-sm" type="radio" name="timeScale" value="MONTHLY" id="period-monthly" aria-label="월별" />
                        </div>
                    </div>

                    <!-- Level 3: Grouping -->
                    <div class="flex flex-col gap-1">
                        <span class="text-xs font-bold opacity-60 ml-1">보기 기준</span>
                        <div class="join">
                            <input class="join-item btn btn-sm" type="radio" name="groupBy" value="STOCK" aria-label="종목별" checked />
                            <input class="join-item btn btn-sm" type="radio" name="groupBy" value="ACCOUNT" aria-label="계좌별" />
                        </div>
                    </div>

                </div>

                <!-- Additional Options: Year & Specific Account Filter -->
                <div class="flex flex-wrap gap-2 items-center justify-end text-sm">
                    <!-- Year: Active only when Monthly/Yearly is related, but good to keep as scope -->
                    <select name="year" class="select select-bordered select-xs">
                        <option value="2026">2026년</option>
                        <option value="2025" selected>2025년</option>
                        <option value="2024">2024년</option>
                    </select>

                    <!-- Account Filter -->
                    <select name="accountId" class="select select-bordered select-xs max-w-xs">
                        <option value="">전체 계좌 포함</option>
                        <option th:each="acc : ${accounts}" 
                                th:value="${acc.id}" 
                                th:text="${acc.name}">계좌명</option>
                    </select>
                </div>

            </form>
        </div>
    </div>

    <!-- Data Content Area -->
    <div id="analytics-content" class="mt-4 min-h-[300px]">
        <div class="flex justify-center py-10">
            <span class="loading loading-spinner text-primary"></span>
        </div>
    </div>
</div>

<!-- 2. Data Content Fragment -->
<div th:fragment="data-content" class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in"
     xmlns:th="http://www.thymeleaf.org">
    
    <!-- Chart Area -->
    <div class="card bg-base-100 shadow-xl col-span-1 lg:col-span-2">
        <div class="card-body">
            <h2 class="card-title text-sm opacity-70" th:text="${chartTitle}">분석 차트</h2>
            <div class="h-80 w-full relative">
                 <canvas id="analysisChart"></canvas>
            </div>
            <div class="text-xs text-right opacity-50 mt-2">* 상위 20개 항목만 표시됩니다.</div>
        </div>
    </div>

    <!-- Summary Table Area -->
    <div class="card bg-base-100 shadow-xl col-span-1">
        <div class="card-body overflow-x-auto p-0 scrollbar-thin">
            <table class="table table-sm table-pin-rows">
                <thead>
                    <tr class="bg-base-200">
                        <th th:text="${keyLabel}">항목</th>
                        <th class="text-right" th:text="${valueLabel}">금액</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${tableData}" class="hover">
                        <td class="font-medium" th:text="${row.key}">항목명</td>
                        <td class="text-right font-mono" 
                            th:text="${#numbers.formatDecimal(row.value, 0, 'COMMA', 0, 'POINT')}"
                            th:classappend="${row.value >= 0} ? 'text-success' : 'text-error'">
                            0
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tableData)}">
                        <td colspan="2" class="text-center py-10 text-base-content/50">
                            <div>데이터가 없습니다.</div>
                            <div class="text-xs mt-1">기간이나 조건을 변경해보세요.</div>
                        </td>
                    </tr>
                </tbody>
                <!-- Footer Total -->
                <tfoot th:if="${not #lists.isEmpty(tableData)}">
                    <tr class="bg-base-200 font-bold">
                        <td>합계</td>
                        <td class="text-right text-primary" 
                            th:text="${#numbers.formatDecimal(totalValue, 0, 'COMMA', 0, 'POINT')}">
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
        (function() {
            // Safe cleanup
            var chartId = 'analysisChart';
            var existingChart = Chart.getChart(chartId);
            if (existingChart) {
                existingChart.destroy();
            }

            var ctx = document.getElementById(chartId);
            if(!ctx) return;

            var labels = /*[[${chartLabels}]]*/ [];
            var datasets = /*[[${chartDatasets}]]*/ [];
            var chartType = /*[[${chartType}]]*/ 'bar';
            
            // Fallback for single dataset structure if legacy data passed (compability)
            var singleData = /*[[${chartData}]]*/ null;
            if((!datasets || datasets.length === 0) && singleData) {
                 var label = /*[[${valueLabel}]]*/ 'Value';
                 datasets = [{
                    label: label,
                    data: singleData,
                    backgroundColor: singleData.map(v => v >= 0 ? 'rgba(54, 162, 235, 0.6)' : 'rgba(255, 99, 132, 0.6)'),
                    borderColor: singleData.map(v => v >= 0 ? 'rgba(54, 162, 235, 1)' : 'rgba(255, 99, 132, 1)'),
                    borderWidth: 1
                }];
            }

            // Fix: Wait for layout to settle to avoid clipping
            setTimeout(function() {
                new Chart(ctx, {
                    type: chartType, 
                    data: {
                        labels: labels,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            padding: {
                                right: 20, // Prevent cut-off
                                left: 10
                            }
                        },
                        scales: {
                            y: { beginAtZero: true },
                            x: {
                                offset: true, // Important for Line chart to show first/last points fully
                                ticks: {
                                    autoSkip: false // Force show all labels if possible
                                }
                            }
                        },
                        plugins: {
                            legend: { display: datasets.length > 1 } 
                        },
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        }
                    }
                });
            }, 100);
        })();
    /*]]>*/
    </script>
</div>

</body>
</html>

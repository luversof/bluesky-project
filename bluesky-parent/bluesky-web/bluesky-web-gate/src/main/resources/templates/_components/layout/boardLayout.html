<!DOCTYPE html>
<html data-layout-decorate="~{_components/layout/defaultLayout}">
<head>
	<script src="https://unpkg.com/dayjs"></script>
	<script src="https://unpkg.com/dayjs/locale/ko"></script>
	<script>
		dayjs.locale('ko');
	</script>
	<script src="https://unpkg.com/dayjs/plugin/relativeTime"></script>
	<script>
		dayjs.extend(window.dayjs_plugin_relativeTime);
	</script>
	<script data-th-src="@{/js/board.js}"></script>
	<script data-th-inline="javascript">
		/*<![CDATA[*/
		boardData.setBoardAlias(/*[[${boardAlias}]]*/ 'boardAlias');
		boardData.setBoardMode(/*[[${boardMode}]]*/ 'boardMode');
		/*]]>*/
	</script>
</head>
<body>
	<div data-layout-fragment="content" class="flex flex-col lg:flex-row">
		<div class="grid bg-base-100">
			<div data-th-replace="~{_components/navmenu (menu = 'board', classAppend = 'bg-base-100 w-56')}" />
		</div>
		<div class="grid grow mx-4" data-layout-fragment="content-board">
			content
		</div>
	</div>
</body>

</html>

stock.simulator.section.assumptions.title = Calculation Rules
stock.simulator.assumption.one         = Initial share count is calculated as principal divided by the current share price.
stock.simulator.assumption.two         = First-year annual dividends use the current share price and the first-year dividend yield, then convert that flow into equal monthly dividends.
stock.simulator.assumption.three       = Share price and dividend inputs are converted into monthly compounding steps.
stock.simulator.assumption.four        = Annual spending is split evenly across 12 months, and the next year's annual spending grows by the configured annual spending growth rate.
stock.simulator.assumption.five        = Each month spending is covered by dividends first, then cash reserve, and finally share sales if needed. The first year total wealth falls to zero or below is treated as depletion.
stock.simulator.assumption.six         = Inputs are treated as after-tax (net) amounts: the dividend yield and growth rates are assumed net of taxes, so no separate tax is applied.

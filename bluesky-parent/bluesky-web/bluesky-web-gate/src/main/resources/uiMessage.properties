stock.dividend.yield.term.daily.average.invested.capital.desc = The cost basis held on each day of the selected period, summed and divided by the number of days. Days without holdings count as 0, so a stock bought mid-period looks small and a yield divided by it looks inflated. Kept for reference; the main measure is the annual yield.
stock.dividend.yield.term.basis.average.invested.capital.desc = The average cost basis held on each dividend record date (the day the right to the dividend is fixed), averaged per account and stock and then summed. Holdings on other days are ignored, so buying just before a record date makes this yield look high.
stock.dividend.yield.term.basis.market.desc = The yield with the denominator set to the average market value on each record date instead of cost basis. It compares with the price at that time rather than what you paid, so it is close to the yield you would have got by buying then.
